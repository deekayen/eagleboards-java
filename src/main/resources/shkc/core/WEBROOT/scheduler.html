      <style type="text/css">
         html, body { height: 100%; }
         body {
            margin: 0;
            padding: 0 8px 8px 8px;
            box-sizing: border-box;
            /* The scheduler is sized to the viewport so an operator sees
               scouts, adults, rooms and boards at once. Panels scroll
               internally; the page itself never does. */
            display: flex;
            flex-direction: column;
            overflow: hidden;
         }
         #main-toolbar { flex: 0 0 auto; }
         .eb-layout {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
         }
         .eb-row {
            display: flex;
            gap: 8px;
            min-height: 0;
         }
         /* Scouts and Adult Board Members sit side by side as they did in the
            original layout, so the top band costs one panel's height, not two.
            The flex shares below reproduce its roughly even three-band split. */
         .eb-row > .eb-panel { flex: 1 1 0; min-width: 0; }
         .eb-row-top { flex: 4 1 0; }
         .eb-panel-rooms { flex: 3 1 0; }
         .eb-panel-boards { flex: 4 1 0; }
         .eb-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 2px;
            flex-wrap: wrap;
         }
         .eb-toolbar button, .eb-toolbar a.eb-btn {
            padding: 4px 12px;
            border: 1px solid #b6b0a4;
            border-radius: 3px;
            background: #E9E9E4;
            color: #232528;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
            display: inline-block;
         }
         .eb-toolbar button:disabled {
            opacity: 0.45;
            cursor: default;
         }
         .eb-toolbar .eb-sep {
            border-left: 1px solid #b6b0a4;
            height: 20px;
         }
         .eb-toolbar .eb-title {
            font-size: large;
            font-weight: bold;
            margin-left: 12px;
         }
         .eb-toolbar input {
            font-size: 13px;
            padding: 2px 4px;
         }
         .eb-panel {
            border: 1px solid #b6b0a4;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
         }
         .eb-panel-title, .eb-panel .eb-toolbar { flex: 0 0 auto; }
         .eb-panel-title {
            background: #E9E9E4;
            border-bottom: 1px solid #b6b0a4;
            padding: 4px 8px;
            font-size: 13px;
            font-weight: bold;
            color: #232528;
            text-align: left;
         }
         .eb-panel .eb-toolbar {
            padding: 4px 6px;
            border-bottom: 1px solid #e6e2da;
         }
         /* Grids fill whatever their panel is given. The old fixed 30vh/26vh/30vh
            heights added up to 86vh of grid alone, which is what forced the page
            to scroll once the toolbars and titles were added on top. */
         .eb-grid-scouts, .eb-grid-adults, .eb-grid-boards {
            flex: 1 1 auto;
            min-height: 80px;
         }

         /* room cards */
         #roomview {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            gap: 6px;
            padding: 6px;
            flex: 1 1 auto;
            min-height: 96px;
            background: #ffffff;
         }
         .eb-room-card {
            flex: 0 0 200px;
            min-height: 84px;
            border: 1px solid #cbd8e4;
            border-radius: 3px;
            background: #E9E9E4;
            padding: 6px 8px;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            overflow: hidden;
         }
         .eb-room-card.selected {
            background: #ffff99;
            border-color: #b6b0a4;
         }

         /* toast notices */
         #eb-toasts {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1000;
            width: 320px;
         }
         .eb-toast {
            border: 1px solid #999;
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            font-size: 13px;
            text-align: left;
            background: #ffffff;
            color: #000;
         }
         .eb-toast-title { font-weight: bold; margin-bottom: 2px; }
         .eb-toast-error { background: #f3b50c; }
         .eb-toast-ok { background: #eeffee; }
         .eb-toast-warn { background: #ffff99; }
         .eb-toast-info { background: #eef4ff; }

         /* modal dialogs */
         .eb-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35);
            z-index: 1100;
            display: flex;
            align-items: center;
            justify-content: center;
         }
         .eb-modal {
            background: #ffffff;
            border: 1px solid #888;
            border-radius: 4px;
            min-width: 300px;
            max-width: 480px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.35);
            text-align: left;
         }
         .eb-modal-title {
            background: #E9E9E4;
            border-bottom: 1px solid #b6b0a4;
            padding: 6px 10px;
            font-weight: bold;
            font-size: 14px;
         }
         .eb-modal-body {
            padding: 12px;
            font-size: 13px;
         }
         .eb-modal-body label { font-size: 13px; }
         .eb-modal-buttons {
            padding: 8px 12px 12px 12px;
            display: flex;
            gap: 12px;
            justify-content: center;
         }
         .eb-modal-buttons button {
            padding: 4px 18px;
            border: 1px solid #b6b0a4;
            border-radius: 3px;
            background: #E9E9E4;
            cursor: pointer;
            font-size: 13px;
         }
      </style>

      <script>

         // ------------------------------------------------------------
         // Room card view (replaces the old card view in cell "c")
         // ------------------------------------------------------------
         function RoomView(container_id) {
            this.el = document.getElementById(container_id);
            this.items = [];
            this.byId = {};
            this.selectedId = null;
            this.filterValue = "";
            this.onAfterSelect = null;    // fired for USER clicks only
         }

         RoomView.prototype.load = function (callback) {
            var t = this;
            ebFetchRows("/room-cells", ["Room", "BoardType", "Scout", "Leaders"])
               .then(function (rows) {
                  t.items = rows;
                  t.byId = {};
                  for (var i = 0; i < rows.length; i++) {
                     t.byId[rows[i].id] = rows[i];
                  }
                  if (t.selectedId && !t.byId[t.selectedId]) {
                     t.selectedId = null;
                  }
                  t.render();
                  if (callback) {
                     callback();
                  }
               })
               .catch(function (e) {
                  console.log("room load failed: " + e);
               });
         };

         RoomView.prototype.render = function () {
            var t = this;
            this.el.innerHTML = "";
            for (var i = 0; i < this.items.length; i++) {
               var obj = this.items[i];
               if (this.filterValue) {
                  var v = this.filterValue;
                  if (!((obj.Scout.indexOf(v) >= 0)
                        || (obj.Leaders.indexOf(v) >= 0)
                        || (obj.Room.indexOf(v) >= 0))) {
                     continue;
                  }
               }
               var card = document.createElement("div");
               card.className = "eb-room-card" + (obj.id === this.selectedId ? " selected" : "");
               card.setAttribute("data-id", obj.id);
               card.innerHTML = "<span style='font-size: medium;'>RM: <b>" + obj.Room + "</b> ("
                       + obj.BoardType + ") </span><span style='font-size: medium; color:" + (obj.color || "#000000") + "'>"
                       + (obj.RoomTime || "") + (obj.Icon || "") + "</span><br/>S: <span style='font-size: medium'><b>"
                       + obj.Scout + "</b></span><br/>L: <b>"
                       + obj.Leaders + "</b>";
               card.addEventListener("click", function () {
                  var id = this.getAttribute("data-id");
                  t.select(id, false);
               });
               this.el.appendChild(card);
            }
         };

         RoomView.prototype.get = function (id) {
            return this.byId[id];
         };

         RoomView.prototype.getSelected = function () {
            return this.selectedId;
         };

         // silent=true for programmatic selection (no cascade)
         RoomView.prototype.select = function (id, silent) {
            this.selectedId = id;
            this.render();
            if (!silent && this.onAfterSelect) {
               this.onAfterSelect(id);
            }
         };

         RoomView.prototype.unselectAll = function () {
            this.selectedId = null;
            this.render();
         };

         RoomView.prototype.remove = function (id) {
            if (this.byId[id]) {
               delete this.byId[id];
               for (var i = 0; i < this.items.length; i++) {
                  if (this.items[i].id === id) {
                     this.items.splice(i, 1);
                     break;
                  }
               }
               if (this.selectedId === id) {
                  this.selectedId = null;
               }
               this.render();
            }
         };

         RoomView.prototype.filter = function (value) {
            this.filterValue = value || "";
            this.render();
         };

         // ------------------------------------------------------------
         // Panels
         // ------------------------------------------------------------
         var schedulerScoutGrid = new SchedulerScoutGrid("grid-scouts", "scout-toolbar", "Youth");
         schedulerScoutGrid.load();

         var schedulerLeaderGrid = new SchedulerAdultGrid("grid-adults", "adult-toolbar", "Adult Board Members");
         schedulerLeaderGrid.load();

         var schedulerBoardGrid = new SchedulerBoardGrid("grid-boards", "Active/Completed Boards");
         schedulerBoardGrid.load();

         var roomView = new RoomView("roomview");

         roomView.onAfterSelect = function (id) {
            var rm_data = roomView.get(id);
            if (rm_data && rm_data.Scout.length > 0) {
               SCHEDULER_selectAllForRoom(rm_data.Room);
            }
            schedulerBoardGrid.highlight();
            schedulerScoutGrid.highlight();
         };

         document.getElementById("room-filter").addEventListener("keyup", function (ev) {
            if (ev.key === "Enter") {
               roomView.filter(this.value);
            }
         });
         document.getElementById("room-filter-clear").addEventListener("click", function () {
            document.getElementById("room-filter").value = "";
            roomView.filter("");
         });

         // ------------------------------------------------------------
         // Refresh plumbing
         // ------------------------------------------------------------
         function refresh_all() {
            schedulerScoutGrid.refresh();
            schedulerLeaderGrid.refresh();
            schedulerBoardGrid.refresh();
            room_refresh();
         }

         function refresh_scouts() {
            schedulerScoutGrid.refresh();
            schedulerBoardGrid.refresh();
         }

         function room_refresh() {
            roomView.load(function () {
               schedulerScoutGrid.setRoomTimerUpdateFunction(SCHEDULER_RoomTimerUpdate);
               setTimeout(function () {
                  schedulerScoutGrid.checkTimers();
               }, 1000);
            });
         }

         room_refresh();

         // room seat-timer badges: [12m] orange at alert time, red at
         // alert+reminder, with a warning icon.
         function SCHEDULER_RoomTimerUpdate(s_room, mins, status) {
            var id = "ROOM:" + s_room;
            var rm_data = roomView.get(id);
            if (rm_data) {
               rm_data.RoomTime = "[" + mins + "m]";
               if (status === "alert") {
                  rm_data.color = "orange";
                  rm_data.Icon = "&nbsp;<img style='vertical-align: middle' src='/images/16x16/dialog-warning-4.png'/>";
               } else if (status === "reminder") {
                  rm_data.color = "red";
                  rm_data.Icon = "&nbsp;<img style='vertical-align: middle' src='/images/16x16/dialog-warning-4.png'/>";
               } else {
                  rm_data.color = "black";
                  rm_data.Icon = "";
               }
               roomView.render();
            }
         }

         function refresh_polling() {
            refresh_scouts();
            // Adults check in too, so the leader grid has to poll alongside the
            // scouts. Rooms are deliberately left out: room_refresh() resets the
            // seat timers, and seating already calls refresh_all() itself.
            schedulerLeaderGrid.refresh();
            console.log("refresh-timeout: " + SCHEDULER_refreshTime + "s");
            setTimeout(refresh_polling, SCHEDULER_refreshTime * 1000);
         }

         SCHEDULER_configReady.then(function () {
            setTimeout(refresh_polling, SCHEDULER_refreshTime * 1000);
         });

         // Panel heights come from flexbox now, so resizing the window changes
         // every grid's height. Tabulator measures once at build time and has to
         // be told to re-measure; debounced so a drag-resize doesn't thrash.
         var gridRedrawTimer = null;
         window.addEventListener("resize", function () {
            clearTimeout(gridRedrawTimer);
            gridRedrawTimer = setTimeout(function () {
               [schedulerScoutGrid, schedulerLeaderGrid, schedulerBoardGrid].forEach(function (grid) {
                  if (grid && grid.table) {
                     try { grid.table.redraw(true); } catch (e) { /* not built yet */ }
                  }
               });
            }, 150);
         });

         // ------------------------------------------------------------
         // Selection cascade (unchanged logic from the original page)
         // ------------------------------------------------------------
         function SCHEDULER_selectScout(s_id) {
            SCHEDULER_autoSelect(s_id);
         }

         function SCHEDULER_autoSelect(s_id) {
            var s_last = schedulerScoutGrid.getColumnValue(s_id, "Last");
            var s_first = schedulerScoutGrid.getColumnValue(s_id, "First");
            var s_btype = schedulerScoutGrid.getColumnValue(s_id, "BoardType");
            var s_room = schedulerScoutGrid.getColumnValue(s_id, "Room");
            var s_status = schedulerScoutGrid.getColumnValue(s_id, "Status");

            // Checked adults are the operator's work in progress: they have
            // decided who is sitting this board. Clicking around the interface
            // must not throw that away -- only the Adult panel's Clear button
            // should. So when anything is already checked, leave the adult
            // checkboxes and the room that goes with them completely alone.
            var boardAlreadyChosen = schedulerLeaderGrid.getCheckedRowIds();

            // Row highlight is not a selection of people; always safe to reset.
            schedulerLeaderGrid.clearSelection();
            schedulerBoardGrid.clearSelection();
            schedulerScoutGrid.highlight();

            if (boardAlreadyChosen) {
               return;
            }

            schedulerLeaderGrid.uncheckAll();
            roomView.unselectAll();

            if (s_status == "Seated") {
               SCHEDULER_selectAllForRoom(s_room);
            } else if (s_status == "InProgress") {
               SCHEDULER_selectAllForRoom(s_room);
            } else if (s_status == "Registered" || s_status == "Verified") {
               // Auto-select used to be reachable only from "Verified". Removing
               // the Verify step left every scout "Registered", which orphaned
               // this whole block -- clicking a scout cleared the adults and
               // then offered nothing back. "Verified" stays for legacy records.
               // proposeBoard (process_seat.js) weighs the whole waiting line:
               // it keeps chairs free for the boards still to come and spends
               // adults whose troop rules them out for scouts still waiting.
               var errors = [];
               var proposal = proposeBoard(
                  SCHEDULER_scoutForProposal(s_id),
                  SCHEDULER_adultsForProposal(),
                  SCHEDULER_waitingForProposal(s_id));
               if (proposal.chairId) {
                  schedulerLeaderGrid.checkRow(proposal.chairId);
               }
               proposal.memberIds.forEach(function (l_id) {
                  schedulerLeaderGrid.checkRow(l_id);
               });
               proposal.problems.forEach(function (problem) {
                  errors.push(problem);
                  ebToast("Auto Select Error", "<span style='font-size: small'>" + problem + "</span>", "error");
               });

               var rm_found = null;
               for (var r = 0; r < roomView.items.length; r++) {
                  var data = roomView.items[r];
                  if ((data.Scout == "" || data.Scout == "-")
                          && (data.BoardType == s_btype)) {
                     roomView.select(data.id, true);
                     rm_found = data.id;
                     break;
                  }
               }

               if (!rm_found) {
                  errors.push("No " + s_btype + " rooms available...");
                  ebToast("Auto Select Error",
                     "<span style='font-size: small'>No " + s_btype + " Rooms Available</span>", "error");
               }

               if (errors.length === 0) {
                  ebToast("Auto Select OK",
                     "<span style='font-size: medium'>Ready to Seat: </span><br/> <b>" + s_last + ", " + s_first + "</b>", "ok");
               }
            } else {
               if ((s_room.length > 0) && (s_room !== "N/A")) {
                  SCHEDULER_selectAllForRoom(s_room);
               } else {
                  schedulerBoardGrid.selectById(s_id);
               }
               schedulerBoardGrid.highlight();
            }
         }

         function SCHEDULER_selectAllForRoom(room_num) {
            if (room_num == "" || room_num == "N/A") {
               return;
            }

            schedulerLeaderGrid.uncheckAll();
            schedulerLeaderGrid.selectForRoom(room_num);
            schedulerBoardGrid.selectForRoom(room_num);
            schedulerScoutGrid.selectForRoom(room_num);

            var rm_id = roomView.getSelected();
            if (rm_id && roomView.get(rm_id).Room == room_num) {
               // already selected
            } else {
               for (var r = 0; r < roomView.items.length; r++) {
                  if (roomView.items[r].Room == room_num) {
                     roomView.select(roomView.items[r].id, true);
                     break;
                  }
               }
            }
         }

         // The shapes proposeBoard takes, read from the grids. Every row is
         // included, filtered out of view or not: the proposal needs the whole
         // picture, and proposeBoard itself skips adults who are not free.
         function SCHEDULER_scoutForProposal(s_id) {
            return {
               id: s_id,
               uname: schedulerScoutGrid.getColumnValue(s_id, "UnitName"),
               btype: schedulerScoutGrid.getColumnValue(s_id, "BoardType")
            };
         }

         function SCHEDULER_adultsForProposal() {
            var adults = [];
            schedulerLeaderGrid.forEachRow(function (l_id) {
               adults.push({
                  id: l_id,
                  uname: schedulerLeaderGrid.getColumnValue(l_id, "UnitName"),
                  final: schedulerLeaderGrid.getColumnValue(l_id, "FinalBoard"),
                  project: schedulerLeaderGrid.getColumnValue(l_id, "ProjectReview"),
                  room: schedulerLeaderGrid.getColumnValue(l_id, "Room"),
                  regTime: schedulerLeaderGrid.getColumnValue(l_id, "RegTime"),
                  woodBadge: schedulerLeaderGrid.getColumnValue(l_id, "WoodBadge"),
                  supporting: schedulerLeaderGrid.getColumnValue(l_id, "Supporting")
               });
            });

            // How long each has waited to volunteer: since sign-in, or since
            // the last board they sat on was completed.
            var boards = [];
            schedulerScoutGrid.forEachRow(function (s_id) {
               boards.push({
                  status: schedulerScoutGrid.getColumnValue(s_id, "Status"),
                  memberIds: schedulerScoutGrid.getColumnValue(s_id, "BoardMembersIDs"),
                  lastUpdate: schedulerScoutGrid.getColumnValue(s_id, "LastUpdateTime")
               });
            });
            var since = freeSinceTimes(adults, boards);
            adults.forEach(function (a) {
               a.freeSince = since[a.id];
            });
            return adults;
         }

         // The other scouts still waiting, in queue order: pre-registered
         // before walk-ins, then by sign-in number (sort_regnum).
         function SCHEDULER_waitingForProposal(s_id) {
            var waiting = [];
            schedulerScoutGrid.forEachRow(function (w_id) {
               var status = schedulerScoutGrid.getColumnValue(w_id, "Status");
               if (w_id !== s_id && (status === "Registered" || status === "Verified")) {
                  var scout = SCHEDULER_scoutForProposal(w_id);
                  scout.regnum = schedulerScoutGrid.getColumnValue(w_id, "RegNum");
                  waiting.push(scout);
               }
            });
            waiting.sort(function (a, b) { return sort_regnum(a.regnum, b.regnum); });
            return waiting;
         }

         // The adults who said at sign-in that they came to support this
         // scout, with where to find them: "Main" if not on a board.
         function SCHEDULER_supportingAdults(s_id) {
            var found = [];
            schedulerLeaderGrid.forEachRow(function (l_id) {
               var ids = (schedulerLeaderGrid.getColumnValue(l_id, "Supporting") || "").split("|");
               if (ids.indexOf(s_id) >= 0) {
                  var l_room = schedulerLeaderGrid.getColumnValue(l_id, "Room");
                  found.push({
                     id: l_id,
                     name: schedulerLeaderGrid.getColumnValue(l_id, "First") + " "
                        + schedulerLeaderGrid.getColumnValue(l_id, "Last"),
                     room: (l_room === "" || l_room === "-") ? "Main" : l_room
                  });
               }
            });
            return found;
         }

         // Locate a scout's leaders (by the Leader column) and parents
         // (same unit + same last name) among the registered adults.
         function SCHEDULER_locateAdults(s_id, parents) {
            var s_last = schedulerScoutGrid.getColumnValue(s_id, "Last");
            var s_first = schedulerScoutGrid.getColumnValue(s_id, "First");
            var s_uname = schedulerScoutGrid.getColumnValue(s_id, "UnitName");
            var s_room = schedulerScoutGrid.getColumnValue(s_id, "Room");
            var s_leader = schedulerScoutGrid.getColumnValue(s_id, "Leader");

            var s_last_lower = s_last.toLowerCase();
            var s_leader_lower = s_leader.toLowerCase();

            var leader_match = [];
            var parent_match = [];

            schedulerLeaderGrid.forEachRow(function (l_id) {
               var l_last = schedulerLeaderGrid.getColumnValue(l_id, "Last");
               var l_first = schedulerLeaderGrid.getColumnValue(l_id, "First");
               var l_uname = schedulerLeaderGrid.getColumnValue(l_id, "UnitName");

               var l_last_lower = l_last.toLowerCase();
               var l_first_lower = l_first.toLowerCase();

               var found = false;
               if (s_leader_lower.indexOf(l_last_lower) >= 0) {
                  // Name Matches
                  if (s_uname === l_uname) {
                     leader_match.push(l_id);
                     found = true;
                  } else if (s_leader_lower.indexOf(l_first_lower) >= 0) {
                     leader_match.push(l_id);
                  }
               }

               if ((found === false) && (l_uname === s_uname)) {
                  if (s_last_lower === l_last_lower) {
                     parent_match.push(l_id);
                  }
               }
            });

            if ((leader_match.length > 0) && (parents === false)) {
               parent_match = [];
            }

            // Those who linked themselves to this scout at sign-in come first
            // and are not guessed at again below.
            var supporting = SCHEDULER_supportingAdults(s_id);
            var supporting_ids = supporting.map(function (a) { return a.id; });
            var not_linked = function (l_id) { return supporting_ids.indexOf(l_id) < 0; };
            leader_match = leader_match.filter(not_linked);
            parent_match = parent_match.filter(not_linked);

            var adult_list = leader_match.concat(parent_match);

            if (adult_list.length == 0 && supporting.length == 0) {
               ebToast("Cannot Locate",
                  "Youth : <b>" + s_first.charAt(0) + " " + s_last + "</b><br/>Leader(s): '" + s_leader + "' <b>not registered.</b>",
                  "warn", 3000);
               return;
            }

            var text = "Youth : <b>" + s_first + " " + s_last + " [" + s_room + "]</b>";
            supporting.forEach(function (a) {
               text = text + "<br/>Supporting: <b>" + ebEscapeHtml(a.name) + " [" + ebEscapeHtml(a.room) + "] </b>";
            });
            for (var i = 0; i < adult_list.length; i++) {
               var l_id = adult_list[i];
               var l_last = schedulerLeaderGrid.getColumnValue(l_id, "Last");
               var l_first = schedulerLeaderGrid.getColumnValue(l_id, "First");
               var l_room = schedulerLeaderGrid.getColumnValue(l_id, "Room");

               if (l_room == "") {
                  l_room = "Main";
               }
               if (leader_match.indexOf(l_id) >= 0) {
                  text = text + "<br/>Leader: <b>" + l_first + " " + l_last + " [" + l_room + "] </b>";
               } else {
                  text = text + "<br/>Parent: <b>" + l_first + " " + l_last + " [" + l_room + "] </b>";
               }
            }

            ebToast("Located", text, "info", 60000);
         }

         // ------------------------------------------------------------
         // Main toolbar
         // ------------------------------------------------------------
         document.getElementById("main-toolbar").addEventListener("click", function (ev) {
            var btn = ev.target.closest("button[data-action]");
            if (!btn) {
               return;
            }
            var id = btn.getAttribute("data-action");

            if (id === "RemoveRoom") {
               PerformRemoveRoomAction();
            } else if (id === "AddRoom") {
               PerformAddRoomAction();
            } else if (id === "ChangeRoom") {
               PerformChangeRoomAction();
            } else if (id === "Admin") {
               window.location.href = "/admin";
            } else if (id === "Help") {
               window.location.href = "/help";
            } else if (id === "Login") {
               window.location.href = "/";
            } else if (id === "Settings") {
               window.location.href = "/configure";
            } else if (id === "Refresh") {
               refresh_all();
            }
         });

         // ------------------------------------------------------------
         // Room management (add / remove / change-swap)
         // ------------------------------------------------------------
         function PerformAddRoomAction() {
            ebModalForm("Add Room",
               "<label>Room #: <input type='text' name='Room' size='8'/></label><br/><br/>"
               + "<label>BoardType: <select name='BoardType'>"
               + "<option value='Final'>Final</option>"
               + "<option value='Project'>Project</option>"
               + "</select></label>",
               [{ name: "Add", label: "Add" }, { name: "Cancel", label: "Cancel" }],
               function (name, body) {
                  if (name !== "Add") {
                     return;
                  }
                  var room = body.querySelector("input[name='Room']").value.trim();
                  var type = body.querySelector("select[name='BoardType']").value;
                  if (room == "") {
                     ebAlert("Add Room Error", "Room # is required.");
                     return false; // keep dialog open
                  }
                  var id = "ROOM:" + room;
                  if (roomView.get(id)) {
                     ebAlert("Add Room Error", "Room '" + room + "' Already Exists.");
                     return false;
                  }
                  ProcessAddRoom(room, type);
               });
         }

         function PerformRemoveRoomAction() {
            var rid = roomView.getSelected();
            if (rid) {
               var rm_data = roomView.get(rid);
               var room = rm_data.Room;
               var scout = rm_data.Scout;

               if (scout && scout !== "") {
                  ebAlert("Remove Room Error", "Room '" + room + "' is currently in use, cannot remove.");
                  return;
               } else {
                  ebConfirm("Confirm Remove Room", "Remove Room '" + room + "' ?", function (result) {
                     if (result) {
                        ProcessRemoveRoom(room);
                     }
                  });
               }
            } else {
               ebAlert("Remove Room Error", "No Room Selected");
               return;
            }
         }

         function PerformChangeRoomAction() {
            var selected_id = roomView.getSelected();
            if (!selected_id) {
               ebAlert("Change Room Error", "No Room Selected");
               return;
            }
            var selected = roomView.get(selected_id);
            var scout = selected.Scout ? " [" + selected.Scout + "]" : "";

            var opts = "";
            for (var r = 0; r < roomView.items.length; r++) {
               var data = roomView.items[r];
               if (data.id !== selected_id) {
                  var s2 = data.Scout ? " [" + data.Scout + "]" : "";
                  opts += "<option value=\"" + data.id + "\">" + data.Room + s2 + "</option>";
               }
            }

            ebModalForm("Change/Swap Rooms",
               "<label>1st Room: <input type='text' name='Rm1' readonly value=\"" + selected.Room + scout + "\"/></label><br/><br/>"
               + "<label>2nd Room: <select name='RmID2'><option value=''></option>" + opts + "</select></label>",
               [{ name: "Change", label: "Change/Swap" }, { name: "Cancel", label: "Cancel" }],
               function (name, body) {
                  if (name !== "Change") {
                     return;
                  }
                  var rmid1 = selected_id;
                  var rmid2 = body.querySelector("select[name='RmID2']").value;
                  if (rmid2 == "") {
                     ebAlert("Change Room Error", "Please select the 2nd room.");
                     return false;
                  }
                  var rm1 = roomView.get(rmid1);
                  var rm2 = roomView.get(rmid2);

                  if (!rm1) {
                     ebAlert("Change Room Error", "No Such Room: " + rmid1);
                     return;
                  }
                  if (!rm2) {
                     ebAlert("Change Room Error", "No Such Room: " + rmid2);
                     return;
                  }

                  if (rm1.BoardType !== rm2.BoardType) {
                     ebConfirm("Change Room",
                        "Room " + rm1.Room + " is a " + rm1.BoardType + " room and Room "
                        + rm2.Room + " is a " + rm2.BoardType + " room. Is this Okay ?",
                        function (result) {
                           if (result) {
                              ProcessChangeRoom(rmid1, rmid2);
                           }
                        });
                  } else {
                     ProcessChangeRoom(rmid1, rmid2);
                  }
               });
         }

         function ProcessAddRoom(room, board_type) {
            ebSaveRow("/room-update", "inserted", "ROOM:" + room, { Room: room, BoardType: board_type })
               .then(function (ok) {
                  if (!ok) {
                     ebAlert("Add Room Error", " Add Room '" + room + "' Failed.");
                  }
               })
               .catch(function () {
                  ebAlert("Add Room Error", " Add Room '" + room + "' Failed.");
               })
               .then(function () {
                  setTimeout(function () {
                     refresh_all();
                  }, 500);
               });
         }

         function ProcessRemoveRoom(room) {
            ebSaveRow("/room-update", "deleted", "ROOM:" + room)
               .then(function (ok) {
                  if (ok) {
                     roomView.remove("ROOM:" + room);
                  } else {
                     ebAlert("Remove Room Error", " Remove Room '" + room + "' Failed.");
                  }
               })
               .catch(function () {
                  ebAlert("Remove Room Error", " Remove Room '" + room + "' Failed.");
               })
               .then(function () {
                  setTimeout(function () {
                     refresh_all();
                  }, 500);
               });
         }

         function ProcessChangeRoom(rmid1, rmid2) {
            ebAction("/room-change", { RmID1: rmid1, RmID2: rmid2 })
               .then(function (res) {
                  if (!res.ok) {
                     ebAlert("Change Room Error", " Change Room '" + rmid1 + " <==> " + rmid2 + "' Failed.<br/>" + res.text);
                  }
               })
               .catch(function () {
                  ebAlert("Change Room Error", " Change Room '" + rmid1 + " <==> " + rmid2 + "' Failed.");
               })
               .then(function () {
                  setTimeout(function () {
                     refresh_all();
                  }, 500);
               });
         }
      </script>

   </body>
</html>
