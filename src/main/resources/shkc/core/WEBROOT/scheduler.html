                  rm_data.color = "orange";
                  rm_data.Icon = "&nbsp;<img style='vertical-align: middle' src='/images/16x16/dialog-warning-4.png'/>";
               } else if (status === "reminder")
               {
                  rm_data.color = "red";

               } else
               {
                  rm_data.color = "black";
               }
               roomView.refresh(id);
            }

         function PerformRemoveRoomAction()
         {
            var rid = roomView.getSelected();
            if (rid)
            {
               var rm_data = roomView.get(rid);

               var room = rm_data.Room;
               var type = rm_data.BoardType;
               var scout = rm_data.Scout;

               if (scout && scout !== "")
               {
                  dhtmlx.alert({
                     title: "Remove Room Error",
                     type: "alert-error",
                     text: "Room '" + room + "' is currently in use, cannot remove."
                  });
                  return;
               } else
               {
                  dhtmlx.confirm({
                     title: "Confirm Remove Room",
                     //type: "alert-error",
                     text: "Remove Room '" + room + "' ?",
                     callback: function (result)
                     {
                        if (result)
                        {
                           ProcessRemoveRoom(room);
                        }
                     }
                  });
                  //  var res = window.confirm("Are you sure you want to remove room '" + room + "' ?");
                  //  if (res)
                  //  {
                  //     roomView.delete(rid);
                  //  }
               }
            } else
            {
               dhtmlx.alert({
                  title: "Remove Room Error",
                  type: "alert-error",
                  text: "No Room Selected"
               });
               return;
            }
         }

         roomChangePopup.attachEvent("onShow", function ()

                  type: "alert-error",
                  text: "No Room Selected"
               });
               return;
            }
            roomChangeForm.reloadOptions("RmID2", []);
            var selected = roomView.get(selected_id);

            var scout = "";
            if (selected.Scout)
            {
               scout = " [" + selected.Scout + "]"
            }
            roomChangeForm.setItemValue("Rm1", selected.Room + scout);
            roomChangeForm.setItemValue("RmID1", selected_id);


            // var rm1_opts = roomChangeForm.getOptions("Rm1");
            var rm2_opts = roomChangeForm.getOptions("RmID2");

            // Need to get the selected Room and flag if no board is in room... also list other available rooms to swap with/move-to.

            var rm_id = roomView.first();
            while (rm_id)
            {
               if (rm_id !== selected_id)
               {
                  var data = roomView.get(rm_id);
                  if (data.Scout)
                  {
                     scout = " [" + data.Scout + "]";
                  } else
                  {
                     scout = "";
                  }
                  // rm1_opts.add(new Option(data.Room + "/" + data.Scout, rm_id));
                  rm2_opts.add(new Option(data.Room + scout, rm_id));
               }
               rm_id = roomView.next(rm_id);
            }

            roomChangeForm.setFocusOnFirstActive();
         });

         function SCHEDULER_autoSelect(s_id)
         {

            var s_last = schedulerScoutGrid.getColumnValue(s_id, "Last");
            var s_first = schedulerScoutGrid.getColumnValue(s_id, "First");
            var s_btype = schedulerScoutGrid.getColumnValue(s_id, "BoardType");
            var s_room = schedulerScoutGrid.getColumnValue(s_id, "Room");
            var s_status = schedulerScoutGrid.getColumnValue(s_id, "Status");

            schedulerLeaderGrid.clearSelection();
            schedulerLeaderGrid.uncheckAll();
            roomView.unselectAll();
            schedulerBoardGrid.clearSelection();
            //scout_highlight(scoutGrid, 7);
            //scoutGrid_highlight();
            schedulerScoutGrid.highlight();

            if (s_status == "Seated")
            {
               SCHEDULER_selectAllForRoom(s_room);
               // SCHEDULER_locateAdults(s_id, false);
            } else if (s_status == "InProgress")
            {
               SCHEDULER_selectAllForRoom(s_room);
               //  SCHEDULER_locateAdults(s_id, true);
            } else if (s_status == "Registered")
            {

            } else if (s_status == "Verified")
            {
               schedulerLeaderGrid.uncheckAll();

               // look through leadersGrid and highlight same rows
               var errors = [];
               var chair_arr = SCHEDULER_findBoardMembers(s_id, s_btype, ["Chair"], 1, []);
               if (chair_arr.length === 0)
               {
                  errors.push("No " + s_btype + " Chairs Available.");
                  dhtmlx.message({
                     title: "Auto Select Error",
                     type: "autoselect-error",
                     text: "<span style='font-size: small'>No " + s_btype + " Chairs Available."
                  });
               }

               var cnt = (s_btype == "Final") ? 2 : 1;
               var members_arr = SCHEDULER_findBoardMembers(s_id, s_btype, ["Member"], cnt, chair_arr);
               if (members_arr.length < cnt)
               {
                  var new_members_arr = SCHEDULER_findBoardMembers(s_id, s_btype, ["Member", "Chair"],
                          cnt - members_arr.length,
                          chair_arr.concat(members_arr));
                  members_arr = members_arr.concat(new_members_arr);
                  if (members_arr.length < cnt)
                  {
                     errors.push("Not enough " + s_btype + " Members Available");
                     dhtmlx.message({
                        title: "Auto Select Error",
                        type: "autoselect-error",
                        text: "<span style='font-size: small'>Only " + members_arr.length + " " + s_btype + " Members Available</span>"

                     });
                  }
               }

               var rm_id = roomView.first();
               while (rm_id)
               {
                  var data = roomView.get(rm_id);
                  if ((data.Scout == "" || data.Scout == "-")
                          && (data.BoardType == s_btype))
                  {
                     roomView.select(rm_id);
                     break;
                  }
                  rm_id = roomView.next(rm_id);
               }

               if (!rm_id)
               {
                  errors.push("No " + s_btype + " rooms available...");
                  dhtmlx.message({
                     title: "Auto Select Error",
                     type: "autoselect-error",
                     text: "<span style='font-size: small'>No " + s_btype + " Rooms Available</span>"
                  });
               }

               if (errors.length > 0)
               {
                  var msg = "<p style='text-align: left; font-size: small;'>";
                  for (i = 0; i < errors.length; i++)
                  {
                     msg += "&nbsp;&nbsp;&nbsp;&nbsp; - " + errors[i] + "<br/>";
                  }
                  return;
               } else
               {
                  dhtmlx.message({
                     title: "Auto Select OK",
                     type: "autoselect-ok",
                     text: "<span style='font-size: medium'>Ready to Seat: </span><br/> <b>" + s_last + ", " + s_first
                  });
               }
            } else
            {
               if ((s_room.length > 0) && (s_room !== "N/A"))
               {
                  SCHEDULER_selectAllForRoom(s_room);
               } else //if (boardGrid.doesRowExist(s_id))
               {
                  schedulerBoardGrid.selectById(s_id);
                  //boardGrid.selectRowById(s_id, true, true, false);
               }
               schedulerBoardGrid.highlight();
            }
         }

         function SCHEDULER_locateAdults(s_id, parents)
         {
            // SCOUT: In,Last,First,UType,Unit,F/P,RM#,Status
            var member_arr = [];
            var s_last = schedulerScoutGrid.getColumnValue(s_id, "Last");
            var s_first = schedulerScoutGrid.getColumnValue(s_id, "First");
            var s_uname = schedulerScoutGrid.getColumnValue(s_id, "UnitName");
            var s_btype = schedulerScoutGrid.getColumnValue(s_id, "BoardType");
            var s_room = schedulerScoutGrid.getColumnValue(s_id, "Room");
            var s_status = schedulerScoutGrid.getColumnValue(s_id, "Status");
            var s_leader = schedulerScoutGrid.getColumnValue(s_id, "Leader");

            var s_last_lower = s_last.toLowerCase();
            var s_leader_lower = s_leader.toLowerCase();

            var leader_match = [];
            var parent_match = [];

            schedulerLeaderGrid.forEachRow(function (l_id)
            {
               var l_last = schedulerLeaderGrid.getColumnValue(l_id, "Last");
               var l_first = schedulerLeaderGrid.getColumnValue(l_id, "First");
               var l_uname = schedulerLeaderGrid.getColumnValue(l_id, "UnitName");
               var l_final = schedulerLeaderGrid.getColumnValue(l_id, "FinalBoard");
               var l_project = schedulerLeaderGrid.getColumnValue(l_id, "ProjectReview");
               var l_room = schedulerLeaderGrid.getColumnValue(l_id, "Room");

               var l_last_lower = l_last.toLowerCase();
               var l_first_lower = l_first.toLowerCase();

               var found = false;
               if (s_leader_lower.indexOf(l_last_lower) >= 0)
               {
                  // Name Matches
                  if (s_uname === l_uname)
                  {
                     leader_match.push(l_id);
                     found = true;
                  } else if (s_leader_lower.indexOf(l_first_lower) >= 0)
                  {
                     leader_match.push(l_id);
                  }
               }

               if ((found === false) && (l_uname === s_uname))
               {
                  if (s_last_lower === l_last_lower)
                  {
                     parent_match.push(l_id);
                     // window.alert(parent_match);
                  }
               }
            });

            if ((leader_match.length) > 0 && (parents === false))
            {
               parent_match = [];
            }

            // SCHEDULER_adultMessage(leader_match, parent_match, s_first.charAt(0) + " " +s_last, s_leader);

            var adult_list = leader_match.concat(parent_match);

            if (adult_list.length == 0)
            {
               dhtmlx.alert({
                  title: "Cannot Locate",
                  //type: "leader-none",
                  type: "alert-warning",
                  text: "Scout : <b>" + s_first.charAt(0) + " " + s_last + "</b><br/>Leader(s): '" + s_leader + "' <b>not registered.</b>",
                  expire: 3000
               });
               return;
            }

            var text = "Scout : <b>" + s_first + " " + s_last + " [" + s_room + "]</b>";
            for (i = 0; i < adult_list.length; i++)
            {
               var l_id = adult_list[i];

               var l_last = schedulerLeaderGrid.getColumnValue(l_id, "Last");
               var l_first = schedulerLeaderGrid.getColumnValue(l_id, "First");
               var l_uname = schedulerLeaderGrid.getColumnValue(l_id, "UnitName");
               var l_final = schedulerLeaderGrid.getColumnValue(l_id, "FinalBoard");
               var l_project = schedulerLeaderGrid.getColumnValue(l_id, "ProjectReview");
               var l_room = schedulerLeaderGrid.getColumnValue(l_id, "Room");


               if (l_room == "")
               {
                  l_room = "Main"
               }
               if (leader_match.indexOf(l_id) >= 0)
               {
                  text = text + "<br/>Leader: <b>" + l_first + " " + l_last + " [" + l_room + "] </b>";
               } else
               {
                  text = text + "<br/>Parent: <b>" + l_first + " " + l_last + " [" + l_room + "] </b>";
               }
            }

            dhtmlx.alert({
               title: "Located",
               //type: "leader-select",
               type: "<span style='text-align: left; font-size: medium;'>" + alert + "</span>",
               text: text,
               expire: 60000
            });
         }

            var this_obj = this;
