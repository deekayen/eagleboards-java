<!DOCTYPE html>
<html>
   <head>
      <title>Adult/Leader Sign-In</title>
      <link rel="stylesheet" type="text/css" href="/dhtmlx/dhtmlx.css">
      <script src="/dhtmlx/dhtmlx.js"></script>
      <link rel="stylesheet" type="text/css" href="scheduler.css"/>
   </head>
   <body >
      <table align="center" style="border:0px solid red; background-color: #ffffff;">
         <tr>
            <td width="50" height="20">&nbsp</td>
            <td width="860" height="20" >&nbsp</td>
            <td width="50" height="20">&nbsp</td>

         </tr>
         <tr>
            <td>&nbsp</td>
            <td align="center"><span class="page-header">Eagle Board</span><br/>
               <span class="page-subheader"><font color="#cc0000">Adult/Leader Sign-In</font></span>
               <br/>
               <br/></td>

            <td>&nbsp</td>
         </tr>
         <tr>
            <td>&nbsp</td>
            <td style="border:0px solid red; vertical-align: bottom">
               <div id="myForm" align="center"  style="width: 760px; height:500px;"></div>
            </td>
            <td>&nbsp</td>

         </tr>
      </table>
      <script>
         var myForm, formData;

         formData = [
            {type: "settings", position: "label-left", offsetLeft: 10, labelWidth: 80, inputWidth: 200},
            {type: "fieldset", label: "<b>Adult/Leader Sign-In</b>", labelWidth: 80, inputWidth: 760, list: [
                  {type: "block", width: 700, list: [
                        {type: "combo", name: "Email", label: "Email:", value: "", tooltip: "Enter Email. If none, enter NONE.", required: true},
                        {type: "hidden", name: "ID", value: ""},
                        {type: "input", name: "Last", label: "Last:", value: "", required: true},
                        {type: "input", name: "First", label: "First:", value: "", required: true},
                        {type: "newcolumn"},
                        {type: "input", name: "Phone", label: "Phone:", value: "", required: true, leftOffset: 20},
                        {type: "select", name: "UnitType", label: "Unit Type:", required: true, leftOffset: 20, options: [
                              {text: "Troop", value: "Troop"},
                              {text: "Team", value: "Team"},
                              {text: "Crew", value: "Crew"},
                              {text: "Ship", value: "Ship"},
                              {text: "Pack", value: "Pack"},
                           ]},
                        {type: "input", name: "Unit", required: true, label: "Unit #:", validate: "ValidInteger", leftOffset: 20, value: ""}
                     ]},
                  {type: "fieldset", label: "I can serve as:", position: "label-right", width: 700, labelWidth: 100, list: [
                        {type: "select", name: "FinalBoard", label: "Final Board:", labelWidth: 60, required: true, options: [
                              {text: "Member", value: "Member"},
                              {text: "Chair", value: "Chair"}
                            
                           ]},
                        {type: "newcolumn"},
                        {type: "select", name: "ProjectReview", label: "Project Review:", offsetLeft: 50, labelWidth: 60, required: true, options: [
                              {text: "Member", value: "Member"},
                              {text: "Chair", value: "Chair"}
                              
                           ]}]}
               ]},
            {type: "block", labelWidth: 80, inputWidth: 700, list: [
                  {type: "button", name: "register", className: "register_button", width: 120, offsetLeft: 55, value: "<b>Register</b>"},
                  {type: "newcolumn"},
                  {type: "button", name: "cancel", width: 120, offsetLeft: 280, value: "<b>Cancel</b>"}
               ]}
         ];
         myForm = new dhtmlXForm("myForm", formData);


         var email_combo = myForm.getCombo("Email");
         email_combo.load("/adult-autofill");

         email_combo.enableAutocomplete(true);
         email_combo.enableFilteringMode(true);

         var last_email = "";
         myForm.attachEvent("onChange", function(name, value) {

            if (name === "Email")
            {
               //  if (last_email != value)
               //alert("attempting change: '" + last_email + "' ? '" + value + "'");
               if (value && (last_email !== value) && (value != "NONE") && (value != "none"))
               {
                  myForm.setItemValue("ID", "");
                  last_email = value;
                  //alert("Email changed to: " + value);
                  myForm.load("/adult-autofill?Email=" + value, "json");
               }
            }
            return true;
         });
         // or
         // myForm.loadStruct(formData, "json");
         myForm.attachEvent("onButtonClick", function(id) {

            if (id == "register") //defines addition
            {
               var email = myForm.getItemValue("Email");
//alert("submit: '" + email +"'");
               myForm.send("register-adult", function(loader, response) {
                  window.location.href = "/";
               });
               //window.location.href = "/";
            }
            else if (id == "cancel") //defines subtraction
            {

               dhtmlx.confirm({
                  title: "Close",
                  type: "confirm-warning",
                  text: "Are you sure you want to Cancel ?",
                  ok: "Yes",
                  cancel: "No",
                  callback: function(val)
                  {
                     if (val)
                     {
                        window.location.href = "/";
                     }
                  }
               });
               // var r = window.confirm("Are you sure you want to Cancel ?");
               // if (r) {
               //    window.location.href = "/";
               // } else {
               //    // DO NOTHING
               // }
            }
         });
      </script>
      <!--
      ,
                        {type: "checkbox", labelWidth: 100, position: "label-right", name: "final_ch", label: "Final Board <br/><b>Member</b>   ", checked: true},
                        {type: "newcolumn"},
                        {type: "checkbox", labelWidth: 100, position: "label-right", name: "project_ch", label: "Project Review <br/><b>Member</b>    ", checked: true},
                        {type: "newcolumn"},
                        {type: "checkbox", labelWidth: 100, position: "label-right", ame: "chair_ch", label: "Final Board <br/><b>Chair</b>   ", checked: false},
                        {type: "newcolumn"},
                        {type: "checkbox", labelWidth: 100, position: "label-right", ame: "chair_ch", label: "Project Review <br/><b>Chair</b>   ", checked: false}

      -->
   </body>
</html>
