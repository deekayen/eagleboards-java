<!DOCTYPE html>
<html>
   <head>
      <link rel="stylesheet" type="text/css" href="/dhtmlx/dhtmlx.css"/>
      <link rel="stylesheet" type="text/css" href="/dhtmlx/skins/terrace/dhtmlx.css"/>
      <link rel="stylesheet" type="text/css" href="scheduler.css"/>

      <script src="/dhtmlx/dhtmlx.js"></script>
      <script>

      </script>
   </head>
   <body>

      <form>
         <table align="center" border="0">
            <tr>
               <td height="1" width="300">&nbsp;</td> 
               <td width="200">&nbsp;</td>            
               <td width="300">&nbsp;</td>            
            </tr>
            <tr>
               <td colspan="3"><h1>Welcome to the Eagle Board.</h1>
                  <h1><u>Please Sign In</u></h1></td>
            </tr>
            <tr>
               <td width="300" height="100" align="center"><input type="button" name="Scout" style="width:200px;height:60px; background: url('ScoutButton.png');
                                                                  background-position:center;
                                                                  background-repeat:no-repeat;
                                                                  border: 0px;" onclick="window.location.href = '/scout_register';"> </td>
               <td></td>
               <td width="300" height="100" align="center"><input type ="button" name="Leader" style="width:200px;height:60px; background: url('LeaderButton.png');
                                                                  background-position:center;
                                                                  background-repeat:no-repeat;
                                                                  border: 0px;" onclick="window.location.href = '/adult_register';"></td>
            </tr>
            <tr>
               <td colspan="3"align="center"><div id="myLayout" align="center"  style="width: 800px; height:300px;"></div>
               </td>
            </tr>
         </table>
      </form>
      <script>
         var myLayout = new dhtmlXLayoutObject({
            parent: "myLayout",
            pattern: "2U"
         });
         myLayout.setSkin("dhx_terrace");
         myLayout.setAutoSize("a;b", "a;b");

         myLayout.cells("a").setText("Registered Scouts");
         scoutGrid = myLayout.cells("a").attachGrid();

         scoutGrid.selMultiRows = false;
         scoutGrid.setImagePath("/dhtmlx/skins/terrace/imgs/dhxgrid_terrace/");
         scoutGrid.setHeader("In,Last,First,UType,Unit");
         scoutGrid.setColumnIds("RegTimeHM,Last,First,UnitType,Unit");
         scoutGrid.setNoHeader(true);

         scoutGrid.setInitWidths("60,100,100,80,*");
         scoutGrid.setColAlign("center,left,left,left,left");
         scoutGrid.setColTypes("ro,ro,ro,ro,ro");
         scoutGrid.setColSorting("time, str,str,str,str");

         scoutGrid.setMultiLine(false);
         scoutGrid.enableDragAndDrop(false);
         scoutGrid.init();

         scoutGrid.load("/scout-cells?cols=RegTimeHM,Last,First,UnitType,Unit",function()
         {
          var num = scoutGrid.getRowsNum();
          if (num>0)
          {
             var id = scoutGrid.getRowId(num-1);
             scoutGrid.showRow(id);
          }
         });


         myLayout.cells("b").setText("Registered Adults");
         leaderGrid = myLayout.cells("b").attachGrid();

         leaderGrid.selMultiRows = false;
         leaderGrid.setImagePath("/dhtmlx/skins/terrace/imgs/dhxgrid_terrace/");
         leaderGrid.setHeader("Last,First,UType,Unit");
         leaderGrid.setColumnIds("Last,First,UnitType,Unit");
         leaderGrid.setNoHeader(true);

         leaderGrid.setInitWidths("100,100,80,*");
         leaderGrid.setColAlign("left,left,left,left");
         leaderGrid.setColTypes("ro,ro,ro,ro");
         leaderGrid.setColSorting("str,str,str,str");

         leaderGrid.setMultiLine(false);
         leaderGrid.enableDragAndDrop(false);
         leaderGrid.init();

         leaderGrid.load("/adult-cells?cols=Last,First,UnitType,Unit",function()
         {
          var num = leaderGrid.getRowsNum();
          if (num>0)
          {
             var id = leaderGrid.getRowId(num-1);
             leaderGrid.showRow(id);
          }
         });

      </script>
   </body>

</html>
