<!DOCTYPE html>
<html>
   <head>
      <link rel="stylesheet" type="text/css" href="scheduler.css"/>
      <script src="/eb-data.js"></script>
      <style>
         .signin-buttons { width: 800px; margin: 0 auto; display: flex; justify-content: space-between; padding: 20px 50px; box-sizing: border-box; }
         .signin-buttons input[type=button] {
            width: 200px; height: 60px; border: 0;
            background-position: center; background-repeat: no-repeat;
            cursor: pointer;
         }
         .reg-panels { width: 800px; margin: 10px auto 0 auto; display: flex; }
         .reg-panel { flex: 1; margin: 0 5px; border: 1px solid #cecece; background: #fff; }
         .reg-panel-title {
            padding: 6px 10px; background: #f4f4f4; border-bottom: 1px solid #cecece;
            font-family: sans-serif; font-size: 13px; font-weight: bold; color: #555;
         }
         .reg-panel-body { height: 268px; overflow-y: auto; }
         .reg-panel table { width: 100%; border-collapse: collapse; font-family: sans-serif; font-size: 12px; color: #444; }
         .reg-panel td { padding: 3px 6px; border-bottom: 1px solid #eee; text-align: left; white-space: nowrap; overflow: hidden; }
         .reg-panel td.c { text-align: center; }
      </style>
   </head>
   <body>

      <h1>Welcome to the Eagle Board.</h1>
      <h1><u>Please Sign In</u></h1>

      <div class="signin-buttons">
         <input type="button" name="Scout" style="background-image: url('ScoutButton.png');"
                onclick="window.location.href = '/scout_register';">
         <input type="button" name="Leader" style="background-image: url('LeaderButton.png');"
                onclick="window.location.href = '/adult_register';">
      </div>

      <div class="reg-panels">
         <div class="reg-panel">
            <div class="reg-panel-title">Registered Scouts</div>
            <div class="reg-panel-body" id="scoutPanel"><table><tbody id="scoutRows"></tbody></table></div>
         </div>
         <div class="reg-panel">
            <div class="reg-panel-title">Registered Adults</div>
            <div class="reg-panel-body" id="adultPanel"><table><tbody id="adultRows"></tbody></table></div>
         </div>
      </div>

      <script>
         function fillPanel(bodyId, panelId, rows, cols, centerCols) {
            var tbody = document.getElementById(bodyId);
            rows.forEach(function (rec) {
               var tr = document.createElement("tr");
               cols.forEach(function (col) {
                  var td = document.createElement("td");
                  if (centerCols.indexOf(col) >= 0) {
                     td.className = "c";
                  }
                  td.textContent = rec[col] || "";
                  tr.appendChild(td);
               });
               tbody.appendChild(tr);
            });
            // Match the old behavior: scroll so the most recent row is visible.
            var panel = document.getElementById(panelId);
            panel.scrollTop = panel.scrollHeight;
         }

         ebFetchRows("/scout-cells", ["RegTimeHM", "Last", "First", "UnitType", "Unit"]).then(function (rows) {
            fillPanel("scoutRows", "scoutPanel", rows, ["RegTimeHM", "Last", "First", "UnitType", "Unit"], ["RegTimeHM"]);
         });

         ebFetchRows("/adult-cells", ["Last", "First", "UnitType", "Unit"]).then(function (rows) {
            fillPanel("adultRows", "adultPanel", rows, ["Last", "First", "UnitType", "Unit"], []);
         });
      </script>
   </body>

</html>
