<!DOCTYPE html>
<html>
   <head>
      <link rel="stylesheet" type="text/css" href="scheduler.css"/>
      <script src="/eb-data.js"></script>
      <style>
         .reg-wrap { width: 640px; margin: 20px auto 0 auto; font-family: sans-serif; }
         .reg-wrap fieldset { border: 1px solid #cecece; border-radius: 3px; padding: 12px 16px; margin-bottom: 14px; background: #fff; }
         .reg-wrap legend { font-size: 13px; color: #444; padding: 0 6px; }
         .reg-cols { display: flex; }
         .reg-col { flex: 1; }
         .reg-row { margin: 7px 0; display: flex; align-items: center; }
         .reg-row label { width: 100px; font-size: 12px; color: #444; text-align: right; padding-right: 8px; }
         .reg-row input, .reg-row select { width: 160px; font-size: 12px; padding: 3px 4px; border: 1px solid #cecece; border-radius: 2px; box-sizing: content-box; }
         .reg-buttons { display: flex; justify-content: space-around; padding: 8px 60px; }
         .reg-buttons button { width: 120px; padding: 7px 0; font-size: 13px; font-weight: bold; cursor: pointer; }
         #statusMsg { text-align: center; font-size: 13px; min-height: 18px; padding: 4px; }
         #statusMsg.ok { color: #006600; font-weight: bold; }
         #statusMsg.err { color: #cc0000; font-weight: bold; }
      </style>
   </head>
   <body style="background-color: #ffffff;">
      <div align="center" style="padding-top: 20px;">
         <span class="page-header">Eagle Board</span><br/>
         <span class="page-subheader" style="color: #000099;">Scout/Candidate Sign-In</span>
      </div>

      <div class="reg-wrap">
         <form id="regForm" autocomplete="off">
            <fieldset>
               <legend><b>Scout Registration</b></legend>
               <div class="reg-cols">
                  <div class="reg-col">
                     <div class="reg-row">
                        <label for="Email">Email:</label>
                        <input type="text" id="Email" name="Email" list="emailOptions" required
                               title="Enter Email. If none, enter NONE.">
                        <datalist id="emailOptions"></datalist>
                     </div>
                     <input type="hidden" name="ID" value="">
                     <div class="reg-row">
                        <label for="Last">Last:</label>
                        <input type="text" id="Last" name="Last" required>
                     </div>
                     <div class="reg-row">
                        <label for="First">First:</label>
                        <input type="text" id="First" name="First" required>
                     </div>
                     <div class="reg-row">
                        <label for="Phone">Phone:</label>
                        <input type="text" id="Phone" name="Phone" required>
                     </div>
                  </div>
                  <div class="reg-col">
                     <div class="reg-row">
                        <label for="DOB">Birthdate:</label>
                        <input type="text" id="DOB" name="DOB" required>
                     </div>
                     <div class="reg-row">
                        <label for="UnitType">Unit Type:</label>
                        <select id="UnitType" name="UnitType" required>
                           <option value="Troop">Troop</option>
                           <option value="Post">Post</option>
                           <option value="Crew">Crew</option>
                           <option value="Ship">Ship</option>
                        </select>
                     </div>
                     <div class="reg-row">
                        <label for="Unit">Unit #:</label>
                        <input type="text" id="Unit" name="Unit" required pattern="[0-9]+"
                               title="Unit # must be a whole number.">
                     </div>
                  </div>
               </div>
               <fieldset>
                  <legend>Board Information</legend>
                  <div class="reg-cols">
                     <div class="reg-col">
                        <div class="reg-row">
                           <label for="BoardType">Board Type:</label>
                           <select id="BoardType" name="BoardType" style="width: 140px;">
                              <option value="Final">Final Eagle Board</option>
                              <option value="Project">Project Review</option>
                           </select>
                        </div>
                     </div>
                     <div class="reg-col">
                        <div class="reg-row">
                           <label for="Leader" style="width: 120px;">Leader Name:</label>
                           <input type="text" id="Leader" name="Leader">
                        </div>
                     </div>
                  </div>
               </fieldset>
            </fieldset>
            <div id="statusMsg"></div>
            <div class="reg-buttons">
               <button type="submit" id="registerBtn" class="register_button"><b>Register</b></button>
               <button type="button" id="cancelBtn"><b>Cancel</b></button>
            </div>
         </form>
      </div>

      <script>
         var form = document.getElementById("regForm");
         var statusMsg = document.getElementById("statusMsg");

         // Populate the Email autofill suggestions.
         ebAutofillList("/scout-autofill").then(function (options) {
            var datalist = document.getElementById("emailOptions");
            options.forEach(function (value) {
               var opt = document.createElement("option");
               opt.value = value;
               datalist.appendChild(opt);
            });
         });

         // When a known email is entered, prefill the rest of the form.
         var last_email = "";
         var PREFILL = ["ID", "Last", "First", "Phone", "DOB", "UnitType", "Unit", "BoardType", "Leader"];
         function onEmailChange() {
            var value = form.elements["Email"].value;
            if (value && last_email !== value && value != "NONE" && value != "none") {
               form.elements["ID"].value = "";
               last_email = value;
               ebAutofillRecord("/scout-autofill", "Email", value).then(function (rec) {
                  if (!rec) {
                     return;
                  }
                  PREFILL.forEach(function (name) {
                     if (rec[name] != null && form.elements[name]) {
                        form.elements[name].value = rec[name];
                     }
                  });
               });
            }
         }
         form.elements["Email"].addEventListener("change", onEmailChange);
         form.elements["Email"].addEventListener("input", onEmailChange);

         function setStatus(text, cls) {
            statusMsg.textContent = text;
            statusMsg.className = cls;
         }

         form.addEventListener("submit", function (ev) {
            ev.preventDefault();
            var fields = {};
            ["Email", "ID", "Last", "First", "Phone", "DOB", "UnitType", "Unit", "BoardType", "Leader"].forEach(function (name) {
               fields[name] = form.elements[name].value;
            });
            var btn = document.getElementById("registerBtn");
            btn.disabled = true;
            setStatus("Registering...", "");
            fetch("/register-scout", {
               method: "POST",
               headers: { "Content-Type": "application/x-www-form-urlencoded" },
               body: ebFormBody(fields)
            }).then(function (r) {
               return r.text().then(function (text) { return { status: r.status, text: text }; });
            }).then(function (res) {
               if (res.status === 200) {
                  setStatus("Registration complete. Thank you!", "ok");
                  setTimeout(function () { window.location.href = "/"; }, 1200);
               } else {
                  btn.disabled = false;
                  setStatus(res.text || "Registration failed. Please try again.", "err");
               }
            }).catch(function () {
               btn.disabled = false;
               setStatus("Registration failed. Please try again.", "err");
            });
         });

         document.getElementById("cancelBtn").addEventListener("click", function () {
            if (window.confirm("Are you sure you want to Cancel ?")) {
               window.location.href = "/";
            }
         });
      </script>
   </body>
</html>
