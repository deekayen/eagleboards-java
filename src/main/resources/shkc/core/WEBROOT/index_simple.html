<!DOCTYPE html>
<html>
   <head>
      <style>
         .signin-buttons { width: 800px; margin: 0 auto; display: flex; justify-content: space-between; padding: 40px 50px; box-sizing: border-box; }
         .signin-buttons input[type=button] {
            width: 200px; height: 60px; border: 0;
            background-position: center; background-repeat: no-repeat;
            cursor: pointer;
         }
      </style>
   </head>
   <body>

      <p style="text-align: center; font-family: sans-serif; font-size: 40pt;">Welcome to the Eagle Board.</p>
      <br/>
      <p style="text-align: center; font-family: sans-serif; font-size: 30pt;">Please Sign In</p>

      <div class="signin-buttons">
         <input type="button" name="Scout" style="background-image: url('ScoutButton.png');"
                onclick="window.location.href='/scout_register.html';">
         <input type="button" name="Leader" style="background-image: url('LeaderButton.png');"
                onclick="window.location.href='/adult_register.html';">
      </div>

   </body>

</html>
