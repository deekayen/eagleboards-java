<!DOCTYPE html>
<html lang="en">

      <title>Eagle Board Admin Page</title>

      <style>
         /* The tab's table fills the window; the table scrolls, the page does not. */

            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 12px;
         }
         .eb-admin > .eb-panel { flex: 1 1 auto; }
      </style>
   </head>
   <!-- Every record, editable as a table: where a result is corrected, an
        adult promoted to chair, or a mistaken identity put right. One link,
        Admin tables, reaches it from every page (SPEC.md P-6); /admin#boards
        and /admin#adults still open those tabs. -->
   <body class="eb-app">

         <span class="eb-brand">Eagle Boards</span>
         <nav class="eb-nav" aria-label="Pages">
            <a href="/scheduler">Event</a>
            <a href="/admin" aria-current="page" title="Every record as an editable table: correct a result, change someone's roles">Admin tables</a>
            <a href="/configure" title="Room timers and other settings">Settings</a>
            <a href="/help" title="How to run an event">Help</a>

         <a class="eb-donate" href="/configure#support" title="Ways to support this project">Donate</a>

      <div class="eb-tabpanel" id="panel-scouts">

            <a class="eb-button" href="/youth-cells?cols=RegTime,Last,First,UnitType,Unit,Leader,Email,BoardType,Room,Status,Result&amp;fmt=csv&amp;filename=Youth.csv">Save CSV</a>
            <span class="eb-sep"></span>

            <a class="eb-button" href="/adult-history-cells?cols=RegTime,Last,First,UnitType,Unit,Email,Phone,FinalBoard,ProjectReview&amp;fmt=csv&amp;filename=AdultHistory.csv">Save CSV</a>

      <div class="eb-tabpanel" id="panel-rooms">
         <div class="eb-toolbar">
            <button id="rooms-refresh">Refresh</button>
            <a class="eb-button" href="/room-cells?cols=Room,BoardType,Scout,Leaders&amp;fmt=csv&amp;filename=Rooms.csv">Save CSV</a>
            <span class="eb-sep"></span>
            <label>Room <input type="text" id="rooms-add-room" size="6"/></label>
            <label>Used for
               <select id="rooms-add-type">
                  <option value="Final">Final boards</option>

            </label>

            <button id="rooms-remove" class="eb-danger">Remove</button>

         <div class="eb-grid" id="grid-rooms"></div>

      <!-- SPEC.md D-22: read only, with no Save CSV or Delete. A mistake is
           corrected in the earlier event itself. -->

         <div class="eb-toolbar">
            <button id="proposals-refresh">Refresh</button>
            <span class="eb-sep"></span>

         </div>
         <div class="eb-grid" id="grid-proposals"></div>
      </div>
      </section>
      </main>

      <script>
         var UNIT_TYPES = ["Troop", "Post", "Crew", "Ship", "Pack"];
         // The adult sign-in form's unit types: District, Council and
         // Community are roles rather than numbered units.
         var ADULT_UNIT_TYPES = UNIT_TYPES.concat(["District", "Council", "Community"]);
         // A value->label map, not an array. Tabulator's list editor uses an
         // array item as BOTH the stored value and the label, which would write
         // "Project review" into BoardType. As an object it stores the key and
         // shows the label, so the data keeps saying "Project" / "Final" -- the
         // values that key room assignments and the Project*/Final* timers. The
         // labels are the Event page's (ebBoardTypeLabel in scheduler_config.js).
         var BOARD_TYPES = { Project: "Project review", Final: "Final board" };
         // A board's decision, exactly the three the Complete dialog offers. Not
         // "Postponed": that is the Status of a scout sent away before any board
         // met them, and such a scout has no Result. test-board-event.sh checks
         // this list against what /complete-board accepts.
         var RESULTS = ["Approved", "Adjourned", "NotApproved"];
         var ROLES = ["Chair", "Member", "Unavailable"];

         // Values read back from the data files carry their escapes (SPEC.md
         // D-1): a comma is stored as "~". Cells show it as a comma; editing
         // one still works on the value as stored.
         function shownText(cell) {
            return ebEscapeHtml(String(cell.getValue() == null ? "" : cell.getValue()).replace(/~/g, ","));
         }

         // A list of names, joined with "," in memory or "~" once saved.
         function shownList(cell) {
            return ebEscapeHtml(String(cell.getValue() == null ? "" : cell.getValue()).split(/[,~]/)
               .map(function (n) { return n.trim(); }).filter(Boolean).join(", "));
         }

         function textCol(title, field, width, extra) {
            var col = {
               title: title, field: field, editor: "input",
               headerFilter: "input", formatter: shownText
            };
            if (width) { col.width = width; }
            for (var k in (extra || {})) { col[k] = extra[k]; }
            return col;
         }

         // `values` is either an array (value doubles as the label) or a
         // value->label map. With a map the editor dropdown shows labels while
         // storing the key -- but the CELL would still render the raw stored
         // value, so the grid would read "Project" under a dropdown offering
         // "Project review". The lookup formatter closes that gap, and the
         // header filter is given the same map so it lists labels too.
         function selectCol(title, field, width, values) {
            var col = {
               title: title, field: field, width: width,
               editor: "list", editorParams: { values: values },
               headerFilter: "list",
               headerFilterParams: { valuesLookup: true, clearable: true }
            };
            if (values && !Array.isArray(values)) {
               col.formatter = "lookup";
               col.formatterParams = values;
               col.headerFilterParams = { values: values, clearable: true };
            }
            return col;
         }

         // A scout's Status is read-only in every table (SPEC.md P-6): it
         // changes only through the Event page's steps, which take and free a
         // room and its members. A status typed into a table once left a
         // scout "seated" with no room, or finished while holding one.
         // /youth-update still refuses Seated, InProgress and a sitting
         // board's status (event test section 25).
         function statusCol(title, width) {
            return roCol(title, "Status", width);
         }

         // The last event an adult signed in at, from "(2026-08-25)(2026-09-22)".
         function lastEvent(cell) {
            var dates = String(cell.getValue() || "").match(/\d{4}-\d{2}-\d{2}/g);
            return dates ? dates[dates.length - 1] : "";
         }

         function roCol(title, field, width, extra) {
            var col = { title: title, field: field, headerFilter: "input" };
            if (width) { col.width = width; }
            for (var k in (extra || {})) { col[k] = extra[k]; }
            return col;
         }

         // Build one grid + wire toolbar. cfg: {el, cellsPath, updatePath, cols,
         // columns, refreshBtn, deleteBtn, deleteNoun}
         function makeGrid(cfg) {
            var table = new Tabulator(cfg.el, {
               data: [],
               index: "id",
               layout: "fitColumns",
               height: "100%",
               selectableRows: 1,
               columns: cfg.columns,
               placeholder: "No data"
            });

            // Background polls must not disturb work in progress, so track open
            // cell editors, keep the row selection across a data swap, and never
            // let two loads overlap.
            var openCellEditors = 0;
            var loadInFlight = false;

            function loadRows(isQuiet) {
               if (loadInFlight) {
                  return Promise.resolve();
               }
               loadInFlight = true;
               var selectedIds = table.getSelectedRows().map(function (row) {
                  return row.getIndex();
               });
               return ebFetchRows(cfg.cellsPath, cfg.cols).then(function (rows) {
                  return table.replaceData(rows).then(function () {
                     if (selectedIds.length) {
                        // Rows can vanish between polls; re-selecting is best effort.
                        try { table.selectRow(selectedIds); } catch (e) { /* gone */ }
                     }
                  });
               }).catch(function () {
                  // A poll failing is not worth a modal; a clicked Refresh is.
                  if (!isQuiet) {
                     alert("Failed to load data from " + cfg.cellsPath);
                  }
               }).then(function () {
                  loadInFlight = false;
               });
            }

            function reload() {
               return loadRows(false);
            }

            function reloadQuiet() {
               return loadRows(true);
            }

            function isEditing() {
               return openCellEditors > 0;
            }

            table.on("tableBuilt", reload);

            table.on("cellEditing", function () {
               openCellEditors++;
            });

            table.on("cellEditCancelled", function () {
               openCellEditors = Math.max(0, openCellEditors - 1);
            });

            table.on("cellEdited", function (cell) {
               openCellEditors = Math.max(0, openCellEditors - 1);
               var fields = {};
               fields[cell.getField()] = cell.getValue();
               ebSaveRowResult(cfg.updatePath, "updated", cell.getRow().getIndex(), fields)
                  .then(function (result) {
                     if (!result.ok) {
                        alert(result.reason || "Server rejected the change; reloading.");
                        reload();
                     }
                  })
                  .catch(function () {
                     alert("Failed to save the change; reloading.");
                     reload();
                  });
            });

            document.getElementById(cfg.refreshBtn).addEventListener("click", reload);

            if (cfg.deleteBtn) {
               document.getElementById(cfg.deleteBtn).addEventListener("click", function () {
                  var rows = table.getSelectedRows();
                  if (rows.length === 0) {
                     alert("Please select a row first.");
                     return;
                  }
                  var row = rows[0];
                  var d = row.getData();
                  if (!window.confirm("Are you sure you want to delete: " + d.Last + ", " + d.First + " ?")) {
                     return;
                  }
                  ebSaveRow(cfg.updatePath, "deleted", row.getIndex(), {})
                     .then(function (ok) {
                        if (ok) {
                           row.delete();
                        } else {
                           alert("Server rejected the delete; reloading.");
                           reload();
                        }
                     })
                     .catch(function () {
                        alert("Failed to delete; reloading.");
                        reload();
                     });
               });
            }

            return { table: table, reload: reload, reloadQuiet: reloadQuiet, isEditing: isEditing };
         }

         // ---- Boards tab (full scout record incl. board results) ----
         var boardsCols = ["Last", "First", "Email", "BoardType", "UnitType", "Unit", "Leader", "Status", "Result", "BoardChair", "BoardMembers", "Notes"];
         var boards = makeGrid({
            el: "#grid-boards",
            cellsPath: "/youth-cells",
            updatePath: "/youth-update",
            cols: boardsCols,
            refreshBtn: "boards-refresh",
            deleteBtn: "boards-delete",
            columns: [
               textCol("Last", "Last", 100),
               textCol("First", "First", 100),
               textCol("Email", "Email", 130),
               selectCol("Board", "BoardType", 80, BOARD_TYPES),
               selectCol("UnitType", "UnitType", 90, UNIT_TYPES),
               textCol("Unit", "Unit", 60),
               textCol("Leader", "Leader", 90),
               statusCol("Status", 90),
               selectCol("Result", "Result", 90, RESULTS),
               textCol("Chair", "BoardChair", 120),
               textCol("Members", "BoardMembers", 180, { formatter: shownList }),
               textCol("Notes", "Notes", null, { editor: "textarea" })
            ]
         });

         // ---- Youth tab (registered youth) ----
         var scoutsCols = ["RegTime", "Last", "First", "UnitType", "Unit", "Leader", "Email", "BoardType", "Room", "Status", "Result"];
         var scouts = makeGrid({
            el: "#grid-scouts",
            cellsPath: "/youth-cells",
            updatePath: "/youth-update",
            cols: scoutsCols,
            refreshBtn: "scouts-refresh",
            deleteBtn: "scouts-delete",
            columns: [
               roCol("In", "RegTime", 90, { hozAlign: "center" }),
               textCol("Last", "Last", 110),
               textCol("First", "First", 110),
               selectCol("UType", "UnitType", 80, UNIT_TYPES),
               textCol("Unit", "Unit", 60),
               textCol("Leader", "Leader", 130),
               textCol("Email", "Email"),
               selectCol("Board", "BoardType", 85, BOARD_TYPES),
               textCol("Room", "Room", 75),
               statusCol("Status", 100),
               selectCol("Result", "Result", 100, RESULTS)
            ]
         });

         // ---- Youth Scheduled tab ----
         var scheduledCols = ["Last", "First", "UnitType", "Unit", "Leader", "Email", "BoardType"];
         var scheduled = makeGrid({
            el: "#grid-scheduled",
            cellsPath: "/youth-scheduled-cells",
            updatePath: "/youth-scheduled-update",
            cols: scheduledCols,
            refreshBtn: "scheduled-refresh",
            deleteBtn: "scheduled-delete",
            columns: [
               textCol("Last", "Last", 110),
               textCol("First", "First", 110),
               selectCol("UType", "UnitType", 85, UNIT_TYPES),
               textCol("Unit", "Unit", 65),
               textCol("Leader", "Leader", 120),
               textCol("Email", "Email"),
               selectCol("Board", "BoardType", 100, BOARD_TYPES)
            ]
         });

         // ---- Adults tab (registered adults) ----
         var adultsCols = ["RegTime", "Last", "First", "UnitType", "Unit", "Email", "Phone", "FinalBoard", "ProjectReview", "Room", "WoodBadge"];
         var adults = makeGrid({
            el: "#grid-adults",
            cellsPath: "/adult-cells",
            updatePath: "/adult-update",
            cols: adultsCols,
            refreshBtn: "adults-refresh",
            deleteBtn: "adults-delete",
            columns: [
               roCol("In", "RegTime", 100, { hozAlign: "center" }),
               textCol("Last", "Last", 120),
               textCol("First", "First", 120),
               selectCol("UnitType", "UnitType", 100, UNIT_TYPES),
               textCol("Unit", "Unit", 90),
               textCol("Email", "Email"),
               textCol("Phone", "Phone", 110),
               selectCol("Final", "FinalBoard", 100, ROLES),
               selectCol("Project", "ProjectReview", 100, ROLES),
               textCol("Room", "Room", 90),
               selectCol("Wood Badge", "WoodBadge", 100, { "": "No", "Y": "Yes" })
            ]
         });

         // ---- Adult history CSV tab ----
         // Every adult who has ever signed in, read-only (SPEC.md P-6): a
         // sign-in writes it, and an edit on the Adults tab reaches the same
         // adult here (/adult-update). /adult-history-update refuses edits.
         var historyCols = ["RegTime", "Last", "First", "UnitType", "Unit", "Email", "Phone", "FinalBoard", "ProjectReview", "BoardHistory"];
         var adultHistory = makeGrid({
            el: "#grid-history",
            cellsPath: "/adult-history-cells",
            updatePath: "/adult-history-update",
            cols: historyCols,
            refreshBtn: "history-refresh",
            columns: [
               roCol("In", "RegTime", 100, { hozAlign: "center" }),
               roCol("Last", "Last", 120, { formatter: shownText }),
               roCol("First", "First", 120, { formatter: shownText }),
               roCol("UnitType", "UnitType", 100),
               roCol("Unit", "Unit", 90),
               roCol("Email", "Email", null, { formatter: shownText }),
               roCol("Phone", "Phone", 115),
               roCol("Final", "FinalBoard", 100),
               roCol("Project", "ProjectReview", 100),
               roCol("Last event", "BoardHistory", 105, { hozAlign: "center", formatter: lastEvent })
            ]
         });

         // ---- Signing an adult in by hand ----
         // For an adult who would rather not use the tablet. It posts to
         // /register-adult, the tablet's own sign-in, so someone in the adult
         // history is recognized and the history gets today's date. Picking
         // them from the history fills the form in and carries their ID, as
         // the tablet's email lookup does, so a corrected name is still them.
         function signIn(fields) {
            return fetch("/register-adult", {
               method: "POST",
               headers: { "Content-Type": "application/x-www-form-urlencoded" },
               body: ebFormBody(fields)
            }).then(function (r) {
               if (!r.ok) {
                  throw new Error("HTTP " + r.status);
               }
            });
         }

         function historyFacts(row) {
            return {
               ID: row.id, First: row.First, Last: row.Last, UnitType: row.UnitType, Unit: row.Unit,
               Email: row.Email, Phone: row.Phone, FinalBoard: row.FinalBoard, ProjectReview: row.ProjectReview
            };
         }

         function options(values, labels) {
            return values.map(function (v) {
               return "<option value='" + ebEscapeHtml(v) + "'>" + ebEscapeHtml((labels && labels[v]) || v) + "</option>";
            }).join("");
         }

         var ROLE_LABELS = { Unavailable: "No thanks" };

         function openAddAdult() {
            var dlg = document.createElement("dialog");
            dlg.className = "eb-dialog";
            dlg.setAttribute("aria-labelledby", "add-adult-title");
            dlg.innerHTML = "<h2 class='eb-dialog-title' id='add-adult-title'>Add an adult</h2>"
               + "<form class='eb-dialog-body' method='dialog'>"
               + "<p>For an adult who would rather not sign in at the tablet. They are signed in for today as if they had.</p>"
               + "<p id='add-adult-known' hidden></p>"
               + "<label>Signed in before? <input type='search' id='add-adult-search' placeholder='Search the adult history by name, email or unit' size='40'/></label>"
               + "<div id='add-adult-matches' role='list'></div>"
               + "<p><label>First name <input id='add-First' required/></label> "
               + "<label>Last name <input id='add-Last' required/></label></p>"
               + "<p><label>Unit type <select id='add-UnitType'>" + options(ADULT_UNIT_TYPES) + "</select></label> "
               + "<label>Unit <input id='add-Unit' size='6'/></label></p>"
               + "<p><label>Email <input id='add-Email' type='email'/></label> "
               + "<label>Phone <input id='add-Phone' type='tel' size='14'/></label></p>"
               + "<p><label>Final board <select id='add-FinalBoard'>" + options(ROLES, ROLE_LABELS) + "</select></label> "
               + "<label>Project review <select id='add-ProjectReview'>" + options(ROLES, ROLE_LABELS) + "</select></label></p>"
               + "<p><label><input type='checkbox' id='add-WoodBadge'/> Counting today toward a Wood Badge ticket item</label></p>"
               + "<p id='add-adult-problem' class='eb-error' role='alert' hidden></p>"
               + "</form>"
               + "<div class='eb-dialog-buttons'>"
               + "<button type='button' class='eb-cancel'>Cancel</button>"
               + "<button type='button' class='eb-ok eb-accent'>Add adult</button>"
               + "</div>";
            document.body.appendChild(dlg);
            var field = function (name) { return dlg.querySelector("#add-" + name); };
            field("FinalBoard").value = "Member";
            field("ProjectReview").value = "Member";
            var knownId = "";
            var history = [];
            ebFetchRows("/adult-history-cells", historyCols).then(function (rows) { history = rows; });

            function fill(row) {
               knownId = row.id;
               ["First", "Last", "UnitType", "Unit", "Email", "Phone", "FinalBoard", "ProjectReview"].forEach(function (name) {
                  if (row[name]) { field(name).value = row[name]; }
               });
               var known = dlg.querySelector("#add-adult-known");
               known.textContent = "From the adult history: " + row.First + " " + row.Last + ", " + row.UnitType + " " + row.Unit;
               known.hidden = false;
               dlg.querySelector("#add-adult-search").value = "";
               dlg.querySelector("#add-adult-matches").innerHTML = "";
            }

            dlg.querySelector("#add-adult-search").addEventListener("input", function () {
               var words = this.value.toLowerCase().split(/\s+/).filter(Boolean);
               var list = dlg.querySelector("#add-adult-matches");
               list.innerHTML = "";
               if (!words.length) {
                  return;
               }
               history.filter(function (row) {
                  var text = [row.First, row.Last, row.Email, row.UnitType + row.Unit, row.UnitType + " " + row.Unit].join(" ").toLowerCase();
                  return words.every(function (w) { return text.indexOf(w) >= 0; });
               }).sort(function (a, b) {
                  return (a.Last + a.First).localeCompare(b.Last + b.First);
               }).slice(0, 5).forEach(function (row) {
                  var pick = document.createElement("button");
                  pick.type = "button";
                  pick.setAttribute("role", "listitem");
                  pick.textContent = row.First + " " + row.Last + " · " + row.UnitType + " " + row.Unit + (row.Email ? " · " + row.Email : "");
                  pick.title = "Fill in the form from " + row.First + " " + row.Last + "'s record";
                  pick.addEventListener("click", function () { fill(row); });
                  list.appendChild(pick);
               });
            });

            function add() {
               var problem = dlg.querySelector("#add-adult-problem");
               if (!field("First").value.trim() || !field("Last").value.trim()) {
                  problem.textContent = "Please enter a first and last name.";
                  problem.hidden = false;
                  return;
               }
               var fields = { ID: knownId, WoodBadge: field("WoodBadge").checked ? "Y" : "" };
               ["First", "Last", "UnitType", "Unit", "Email", "Phone", "FinalBoard", "ProjectReview"].forEach(function (name) {
                  fields[name] = field(name).value.trim();
               });
               signIn(fields).then(function () {
                  dlg.close();
                  adults.reload();
               }).catch(function () {
                  problem.textContent = "The adult could not be signed in. Try again.";
                  problem.hidden = false;
               });
            }

            dlg.querySelector(".eb-ok").addEventListener("click", add);
            dlg.querySelector(".eb-cancel").addEventListener("click", function () { dlg.close(); });
            dlg.querySelector("form").addEventListener("submit", function (ev) {
               ev.preventDefault();
               add();
            });
            dlg.addEventListener("close", function () { dlg.remove(); });
            dlg.showModal();
            dlg.querySelector("#add-adult-search").focus();
         }

         document.getElementById("adults-add").addEventListener("click", openAddAdult);

         document.getElementById("history-signin").addEventListener("click", function () {
            var selected = adultHistory.table.getSelectedRows();
            if (selected.length === 0) {
               alert("Please select an adult first.");
               return;
            }
            // Their Last event becomes today, which shows it worked (D-14).
            signIn(historyFacts(selected[0].getData())).then(adultHistory.reload).catch(function () {
               alert("The adult could not be signed in. Try again.");
            });
         });

         // ---- Rooms tab ----
         var roomsCols = ["Room", "BoardType", "Scout", "Leaders"];
         var rooms = makeGrid({
            el: "#grid-rooms",
            cellsPath: "/room-cells",
            updatePath: "/room-update",
            cols: roomsCols,
            refreshBtn: "rooms-refresh",
            columns: [
               { title: "Room", field: "Room", width: 90, hozAlign: "center", sorter: "number" },
               selectCol("BoardType", "BoardType", 130, BOARD_TYPES),
               { title: "Youth", field: "Scout", width: 260 },
               { title: "Leaders", field: "Leaders", formatter: shownList }
            ]
         });

         document.getElementById("rooms-add").addEventListener("click", function () {
            var roomInput = document.getElementById("rooms-add-room");
            var room = roomInput.value.trim();
            var type = document.getElementById("rooms-add-type").value;
            if (room === "") {
               alert("Please enter a room number.");
               return;
            }
            var id = "ROOM:" + room;
            var existing = rooms.table.getRow(id);
            if (existing) {
               alert("Room '" + room + "' Already Exists");
               return;
            }
            ebSaveRow("/room-update", "inserted", id, {
               Room: room, BoardType: type, Scout: "", Leaders: ""
            }).then(function (ok) {
               if (ok) {
                  roomInput.value = "";
               } else {
                  alert("Server rejected the new room.");
               }
               rooms.reload();
            }).catch(function () {
               alert("Failed to add the room; reloading.");
               rooms.reload();
            });
         });

         document.getElementById("rooms-remove").addEventListener("click", function () {
            var selected = rooms.table.getSelectedRows();
            if (selected.length === 0) {
               alert("Please select a room first.");
               return;
            }
            var row = selected[0];
            var d = row.getData();
            if (d.Scout && d.Scout !== "") {
               alert("Room '" + d.Room + "' is currently in use, cannot remove.");
               return;
            }
            if (!window.confirm("Are you sure you want to remove room '" + d.Room + "' ?")) {
               return;
            }
            ebSaveRow("/room-update", "deleted", row.getIndex(), {})
               .then(function (ok) {
                  if (ok) {
                     row.delete();
                  } else {
                     alert("Server rejected the remove; reloading.");
                     rooms.reload();
                  }
               })
               .catch(function () {
                  alert("Failed to remove the room; reloading.");
                  rooms.reload();
               });
         });

         // ---- Approved proposals tab (SPEC.md D-22) ----
         // Every project proposal approved at an earlier event in the data
         // folder, however long ago, read from /approved-proposals-cells each
         // time the tab is shown. The line above says which events were read,
         // and names any that couldn't be.
         var proposalsCols = ["Event", "Last", "First", "UnitType", "Unit", "BoardChair", "BoardMembers", "Notes"];
         function proposalUnit(cell) {
            var d = cell.getRow().getData();
            return ebEscapeHtml((d.UnitType + " " + d.Unit).trim());
         }
         // The board's other members: the chair is in a column of their own.
         function otherMembers(cell) {
            var chair = String(cell.getRow().getData().BoardChair || "").trim();
            return ebEscapeHtml(String(cell.getValue() || "").split(/[,~]/)
               .map(function (n) { return n.trim(); }).filter(function (n) { return n && n !== chair; }).join(", "));
         }
         var proposals = makeGrid({
            el: "#grid-proposals",
            cellsPath: "/approved-proposals-cells",
            cols: proposalsCols,
            refreshBtn: "proposals-refresh",
            columns: [
               roCol("Last", "Last", 130, { formatter: shownText }),
               roCol("First", "First", 120, { formatter: shownText }),
               roCol("Unit", "Unit", 110, { formatter: proposalUnit }),
               roCol("Approved", "Event", 110, { hozAlign: "center" }),
               roCol("Chair", "BoardChair", 150, { formatter: shownText }),
               roCol("Other members", "BoardMembers", 220, { formatter: otherMembers }),
               roCol("Notes", "Notes", null, { formatter: shownText })
            ]
         });

         function loadProposalsSummary() {
            fetch("/approved-proposals-cells?cols=Last").then(function (r) { return r.text(); }).then(function (text) {
               var rows = ebParseXML(text).getElementsByTagName("rows")[0];
               var read = rows ? parseInt(rows.getAttribute("read"), 10) : 0;
               // The Windows version's words (EarlierEvents.ApprovedProposals.About).
               var said = !read ? "No earlier events in this data folder."
                  : read === 1 ? "Read from 1 earlier event, " + rows.getAttribute("from") + "."
                  : "Read from " + read + " earlier events, " + rows.getAttribute("from") + " to " + rows.getAttribute("to") + ".";
               var unreadable = rows ? rows.getAttribute("unreadable") : "";
               if (unreadable) {
                  said += " Could not read " + unreadable.split("|").join("; ") + ".";
               }
               document.getElementById("proposals-summary").textContent = said;
            });
         }
         document.getElementById("proposals-refresh").addEventListener("click", loadProposalsSummary);

         // ---- Tab switching ----
         var gridsByTab = {
            boards: boards, scouts: scouts, scheduled: scheduled,
            adults: adults, history: adultHistory, rooms: rooms, proposals: proposals
         };

         document.getElementById("tabbar").addEventListener("click", function (ev) {
            var btn = ev.target.closest("button[data-tab]");
            if (!btn) {
               return;
            }
            var tab = btn.getAttribute("data-tab");
            var buttons = document.querySelectorAll("#tabbar button");
            for (var i = 0; i < buttons.length; i++) {
               buttons[i].classList.toggle("active", buttons[i] === btn);
            }
            var panels = document.querySelectorAll(".eb-tabpanel");
            for (var p = 0; p < panels.length; p++) {
               panels[p].classList.toggle("active", panels[p].id === "panel-" + tab);
            }
            // A reload, or the Back button, comes back to this tab.
            history.replaceState(null, "", "#" + tab);
            // Tabulator needs a redraw after its container becomes visible.
            gridsByTab[tab].table.redraw(true);
            // Switching tabs should show current data, not whatever was last polled.
            gridsByTab[tab].reloadQuiet();
            if (tab === "proposals") {
               loadProposalsSummary();
            }
         });

         // Open the tab the URL names (/admin#boards, /admin#adults), so a
         // link from the Event page lands on the right table.
         // Once that tab's table is built: a redraw before then throws.
         var openTab = document.querySelector("#tabbar button[data-tab='" + location.hash.slice(1) + "']");
         if (openTab) {
            gridsByTab[openTab.getAttribute("data-tab")].table.on("tableBuilt", function () {
               openTab.click();
            });
         }

         // A link to another tab while already here only changes the hash.
         window.addEventListener("hashchange", function () {
            var button = document.querySelector("#tabbar button[data-tab='" + location.hash.slice(1) + "']");
            if (button && !button.classList.contains("active")) {
               button.click();
            }
         });

         // ---- Live updates ----
         // The server says when anything changes (/events, see ChangeFeed.java),
         // so new check-ins and the scheduler's steps appear without anyone
         // pressing Refresh and without polling (SPEC.md D-15). Only the tab on
         // show is re-read, and never while a cell is being edited: the save that
         // ends the edit sends a change of its own, which re-reads then.
         function activeGrid() {
            var activeButton = document.querySelector("#tabbar button.active");
            var tab = activeButton && activeButton.getAttribute("data-tab");
            return tab ? gridsByTab[tab] : null;
         }

         // Approved proposals come from earlier events, which don't change
         // during this one: they are read when the tab is shown, not on every
         // change here (D-15, D-22).
         new EventSource("/events").onmessage = function () {
            var grid = activeGrid();
            if (grid && grid !== proposals && !grid.isEditing()) {
               grid.reloadQuiet();
            }
         };

         // Returning to a backgrounded tab should show current data immediately
         // rather than after up to a full interval.
         document.addEventListener("visibilitychange", function () {
            var grid = activeGrid();
            if (!document.hidden && grid && !grid.isEditing()) {
               grid.reloadQuiet();
            }
         });

         // The panel's height comes from flexbox now, so resizing the window
         // changes the grid's height. Tabulator measures once at build time and
         // has to be told to re-measure; debounced so a drag doesn't thrash.
         var adminRedrawTimer = null;
         window.addEventListener("resize", function () {
            clearTimeout(adminRedrawTimer);
            adminRedrawTimer = setTimeout(function () {
               var grid = activeGrid();
               if (grid && grid.table) {
                  try { grid.table.redraw(true); } catch (e) { /* not built yet */ }
               }
            }, 150);
         });
      </script>
   </body>
</html>
