name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Runtime proof across platforms the app is deployed on:
    # amd64 Linux + Windows, and arm64 Linux (Raspberry Pi deployment target).
    # macOS is not a deployment target, but the shell scripts claim to run
    # there and it is the only leg with BSD userland -- sed, awk, stat and seq
    # all differ from GNU. CONTRIBUTING warns that a portability bug in these
    # scripts surfaces as a false PASS, so the cheapest way to keep that claim
    # honest is to actually run them on it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build shaded jar
        shell: bash
        run: ./mvnw --batch-mode package
      - name: Structural check
        shell: bash
        run: |
          # Files instead of pipes: grep -q into a pipe SIGPIPEs the producer
          # under this shell's pipefail. jar (from the JDK) exists everywhere.
          NEW_JAR=$(ls target/eagleboardscheduler-*.jar | grep -v original- | head -1)
          jar tf "$NEW_JAR" > jar-contents.txt
          grep -q "shkc/core/EagleBoardScheduler.class" jar-contents.txt
          jar xf "$NEW_JAR" META-INF/MANIFEST.MF
          grep -q "Main-Class: shkc.core.EagleBoardScheduler" META-INF/MANIFEST.MF
      - name: Board composition rules (same-unit conflict detection)
        shell: bash
        # The scheduler must flag board members from the scout's own unit --
        # a council rule the reviewer may override, but must never miss. The
        # rule lives in client-side JS, so no server request exercises it and
        # the runtime smoke test below cannot see it. Node is preinstalled on
        # all three runners; no packages are installed and no network is used.
        run: node scripts/test-seat-conflicts.js
      - name: Runtime smoke test (start server, exercise endpoints)
        shell: bash
        run: |
          # Full behavioral parity needs the real data files (never in the
          # repo); this smoke test uses header-only data to prove the server
          # starts, serves the UI, and answers data endpoints on this OS/arch.
          NEW_JAR=$(ls target/eagleboardscheduler-*.jar | grep -v original- | head -1)
          echo 'Type,ID,Last,First,Email,Phone,UnitType,Unit,UnitName,ProjectReview,FinalBoard,RegTime,Room,Flags,Sel,BoardHistory' > SmokeAdults.csv
          java -jar "$NEW_JAR" -verbose -a SmokeAdults.csv -c config.properties -port 18099 -d smokerun > server.log 2>&1 &
          SRV=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:18099/index.html && break
            sleep 1
            if [ "$i" = 30 ]; then echo "server never became ready"; cat server.log; exit 1; fi
          done
          set -e
          curl -sf http://127.0.0.1:18099/index.html -o index.out
          grep -q "Welcome to Review Boards" index.out
          curl -sf http://127.0.0.1:18099/admin.html -o admin.out
          grep -qi "Review Board Admin Page" admin.out
          curl -sf -o /dev/null http://127.0.0.1:18099/youth-cells
          curl -sf -o /dev/null http://127.0.0.1:18099/room-cells
          curl -sf -X POST --data "Last=Smoke&First=Test&Email=s@example.org&UnitType=Troop&Unit=1&BoardType=Final" http://127.0.0.1:18099/register-youth -o /dev/null
          test -f smokerun/scouts.csv && grep -q "Smoke" smokerun/scouts.csv
          # Regression guard: seating a board with no members must NOT crash
          # the server (was a NullPointerException -> 500 in SeatBoardHandler).
          curl -sf -X POST --data '!nativeeditor_status=inserted&gr_id=ROOM:1&Room=1&BoardType=Final' http://127.0.0.1:18099/room-update -o /dev/null
          # No verify step any more: the Verify gate was removed, so the scout
          # registered above is already seatable as Registered.
          seat_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST --data "RoomID=ROOM:1&ScoutID=SCOUT:Smoke:Test:1&ChairID=X" http://127.0.0.1:18099/seat-board)
          if [ "$seat_code" = "500" ]; then echo "REGRESSION: seat-board 500 on missing members"; cat server.log; exit 1; fi
          # And the server must still serve pages afterward (no wedge).
          curl -sf -o /dev/null http://127.0.0.1:18099/index.html
          curl -sf -o /dev/null http://127.0.0.1:18099/youth-cells
          kill $SRV
          echo "runtime smoke passed on ${{ matrix.os }}"
      - name: Board lifecycle (convene, then review)
        shell: bash
        # Seating convenes the board; the scout is only brought in by
        # /inprogress-board. Guards the bug that restoring the Seated state
        # re-exposed: /complete-board used to accept a Seated scout, which
        # records a result for a review that never happened -- harmless only
        # while Seat went straight to InProgress and nothing was ever Seated.
        run: |
          NEW_JAR=$(ls target/eagleboardscheduler-*.jar | grep -v original- | head -1)
          echo 'Type,ID,Last,First,Email,Phone,UnitType,Unit,UnitName,ProjectReview,FinalBoard,RegTime,Room,Flags,Sel,BoardHistory' > LifeAdults.csv
          java -jar "$NEW_JAR" -a LifeAdults.csv -c config.properties -port 18099 -d liferun > life.log 2>&1 &
          SRV=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:18099/index.html && break
            sleep 1
            if [ "$i" = 30 ]; then echo "server never became ready"; cat life.log; exit 1; fi
          done
          set -e
          B=http://127.0.0.1:18099
          # Scout in Troop 1234; three members from other units, so the
          # same-unit rule does not interfere with this lifecycle check.
          curl -sf -X POST --data "Last=Life&First=Test&Email=l@example.org&UnitType=Troop&Unit=1234&UnitName=T1234&BoardType=Final" $B/register-youth -o /dev/null
          # Rep901 is registered as a Chair, not a Member: SeatBoardHandler
          # requires a Final board to be chaired by someone whose FinalBoard
          # role is Chair. Three plain Members is not a seatable board, so a
          # fixture built from them would fail at /seat-board before this step
          # ever reached the lifecycle it is here to check.
          curl -sf -X POST --data "Last=Rep901&First=M&Email=r901@example.org&UnitType=Troop&Unit=901&UnitName=T901&ProjectReview=Chair&FinalBoard=Chair" $B/register-adult -o /dev/null
          for u in 902 903; do
            curl -sf -X POST --data "Last=Rep$u&First=M&Email=r$u@example.org&UnitType=Troop&Unit=$u&UnitName=T$u&ProjectReview=Member&FinalBoard=Member" $B/register-adult -o /dev/null
          done
          curl -sf -X POST --data '!nativeeditor_status=inserted&gr_id=ROOM:1&Room=1&BoardType=Final' $B/room-update -o /dev/null
          SID="SCOUT:Life:Test:1234"
          MEMBERS="ADULT:Rep901:M:901,ADULT:Rep902:M:902,ADULT:Rep903:M:903"
          curl -sf -X POST --data "RoomID=ROOM:1&ScoutID=$SID&ChairID=ADULT:Rep901:M:901&MemberIDs=$MEMBERS" $B/seat-board -o /dev/null
          grep -q ",Seated," liferun/scouts.csv || { echo "FAIL: seating did not leave the board Seated"; cat liferun/scouts.csv; exit 1; }
          # The guard: completing while still convening must be refused.
          curl -s -X POST --data "RoomID=ROOM:1&ScoutID=$SID&Result=Approved" $B/complete-board -o complete.out
          if grep -q ",Completed," liferun/scouts.csv; then
            echo "REGRESSION: complete-board accepted a Seated scout (review never started)"
            cat complete.out; exit 1
          fi
          # Bring the scout in, then completing is allowed.
          curl -sf -X POST --data "ScoutID=$SID" $B/inprogress-board -o /dev/null
          grep -q ",InProgress," liferun/scouts.csv || { echo "FAIL: Start Review did not reach InProgress"; exit 1; }
          curl -sf -X POST --data "RoomID=ROOM:1&ScoutID=$SID&Result=Approved" $B/complete-board -o /dev/null
          grep -q ",Completed," liferun/scouts.csv || { echo "FAIL: complete after Start Review did not complete"; exit 1; }
          kill $SRV
          echo "board lifecycle passed on ${{ matrix.os }}"
      - name: Board evening (14 scouts, 12 rooms, 30 adults, 5 chairs)
        shell: bash
        # A whole evening at the district's real shape, deliberately short of
        # chairs so boards queue behind the five people who may chair one.
        # Covers what no single-board check can: adults committed to one room
        # and released when the review completes, the rules holding for
        # requests that never went through our UI, and postpone/reset handing
        # the room and the members back. Synthetic names, spare port, throwaway
        # data dir -- never the real Master_AdultHistory.csv.
        run: bash scripts/test-board-evening.sh
      - name: Windows launcher (run.bat picks the newest jar, warns on shadowed WEBROOT)
        if: matrix.os == 'windows-latest'
        shell: cmd
        # run.bat is what the app is actually launched with at an event, and it
        # silently sat two fixes behind run.sh: it took whatever the wildcard
        # glob happened to return, and it never warned about a WEBROOT\ folder
        # shadowing the jar's UI. Nothing on Linux or macOS can exercise
        # cmd.exe, so this leg is the only check the Windows launcher gets.
        # EB_DRYRUN stops the script before it launches Java.
        run: |
          for %%j in (target\eagleboardscheduler-*.jar) do set "REALJAR=%%~nxj"
          rem A decoy that sorts LAST alphabetically but is OLD on the clock.
          rem A plain glob starts it; ordering by timestamp does not.
          copy /y "target\%REALJAR%" target\eagleboardscheduler-9999.12.31.jar >nul
          powershell -NoProfile -Command "(Get-Item 'target\eagleboardscheduler-9999.12.31.jar').LastWriteTime = (Get-Date).AddDays(-30)"
          mkdir WEBROOT
          set EB_DRYRUN=1
          call scripts\run.bat > runbat.out 2>&1
          type runbat.out
          rmdir /s /q WEBROOT
          findstr /c:"DRYRUN: would start target\%REALJAR%" runbat.out >nul || (echo FAIL: run.bat did not start the newest jar & exit /b 1)
          findstr /c:"holds more than one build" runbat.out >nul || (echo FAIL: run.bat did not flag the extra jar in target\ & exit /b 1)
          rem No backslash-space in a findstr /c: literal: findstr eats the
          rem backslash there and the match fails even though the line is
          rem present. Backslash before a letter, as in the DRYRUN line above,
          rem is fine. Match the part of the warning that has neither.
          findstr /c:"WARNING: a WEBROOT" runbat.out >nul || (echo FAIL: run.bat did not warn about the shadowing WEBROOT folder & exit /b 1)
          echo run.bat launcher checks passed

      - name: SignUpGenius live API check
        # One leg only, push only: secrets are absent on fork/Dependabot PRs,
        # and one API call per commit is plenty.
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        shell: bash
        env:
          SUG_KEY: ${{ secrets.SUG_KEY }}
        run: |
          if [ -z "$SUG_KEY" ]; then
            echo "SUG_KEY secret not set — skipping live API check."
            exit 0
          fi
          # PII rule: the API returns real registrant names/emails. The app is
          # run WITHOUT -verbose (per-registrant log lines are verbose-gated)
          # and the raw log is never printed — only these coarse markers.
          # GitHub also masks the secret value in any log output.
          NEW_JAR=$(ls target/eagleboardscheduler-*.jar | grep -v original- | head -1)
          echo 'Type,ID,Last,First,Email,Phone,UnitType,Unit,UnitName,ProjectReview,FinalBoard,RegTime,Room,Flags,Sel,BoardHistory' > SugAdults.csv
          java -jar "$NEW_JAR" -a SugAdults.csv -c config.properties -port 18098 -d sugrun -sugkey "$SUG_KEY" > sug.log 2>&1 &
          SRV=$!
          verdict=""
          for i in $(seq 1 60); do
            if grep -q "SignupID :" sug.log; then verdict=imported; break; fi
            if grep -q "no valid" sug.log; then verdict=none-active; break; fi
            if grep -qE "error connecting to SignUpGenius|Exception" sug.log; then verdict=error; break; fi
            sleep 1
          done
          kill $SRV 2>/dev/null || true
          case "$verdict" in
            imported)    echo "PASS: API key valid; active signup found and registrations imported." ;;
            none-active) echo "PASS: API key valid and response parsed; no Eagle Board signup currently in date range." ;;
            error)       echo "FAIL: SignUpGenius API error:"; grep -E "error connecting|Exception" sug.log | sed "s/$SUG_KEY/***/g" | head -3; exit 1 ;;
            *)           echo "FAIL: no verdict within 60s"; exit 1 ;;
          esac

  parity:
    # THE ACCEPTANCE GATE. verify-parity.sh boots the inherited 2019 binary and
    # the rebuilt jar side by side and proves they still behave identically for
    # everything that was not changed on purpose -- class signatures, served
    # bytes, endpoint responses, data files written, startup logs. CLAUDE.md is
    # explicit that this mechanical check, not code review, is what qualifies a
    # change here, because the owner does not review Java.
    #
    # It ran nowhere until now: the only mention of it in .github/ was an
    # unticked checkbox in the pull request template, which meant the project's
    # stated gate was on the honor system.
    #
    # Two legs, not three: this checks BEHAVIOR, which does not vary by
    # platform, so it does not need the full matrix. macOS is here because the
    # script itself is shell and CONTRIBUTING warns that a portability bug in
    # it surfaces as a false PASS -- BSD userland is where that would happen.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read          # enough to download the release asset below
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Fetch the inherited reference binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # The inherited jar cannot live in the repository: it is 3.2 MB, it
        # embeds a live SignUpGenius API key, and it sits under the unresolved
        # rights question. It is gitignored AND blocked by
        # scripts/hooks/pre-commit, so CI pulls it from a private prerelease in
        # this same repo instead. Deleting that release before the repository
        # is ever made public is on the pre-public checklist in PROVENANCE.md.
        run: |
          mkdir -p original
          gh release download parity-reference \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'EagleBoardScheduler_20190618.jar' \
            --dir original
          # PROVENANCE.md records this digest. Verify before trusting the file:
          # parity against the WRONG reference binary is worse than no parity
          # at all, because it still reports PASS.
          want=5d88ea0107e48c89b8994f2a4a711ad3423c1f3dda41b04a689bf7f820adbebd
          f=original/EagleBoardScheduler_20190618.jar
          # sha256sum is GNU; macOS ships shasum instead.
          if command -v sha256sum >/dev/null 2>&1; then
            got=$(sha256sum "$f" | awk '{print $1}')
          else
            got=$(shasum -a 256 "$f" | awk '{print $1}')
          fi
          if [ "$got" != "$want" ]; then
            echo "reference binary digest mismatch"
            echo "  want: $want"
            echo "  got:  $got"
            exit 1
          fi
          echo "reference binary verified against PROVENANCE.md"
      - name: Build the jar under test
        shell: bash
        run: ./mvnw --batch-mode package
      - name: Parity gate
        shell: bash
        run: bash scripts/verify-parity.sh
