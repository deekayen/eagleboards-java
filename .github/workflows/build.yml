name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Runtime proof across platforms the app is deployed on. All runners are
    # amd64; arm64 is covered by the maintainer's machines (macOS/Raspberry Pi).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build shaded jar
        shell: bash
        run: ./mvnw --batch-mode package
      - name: Structural check
        shell: bash
        run: |
          # Files instead of pipes: grep -q into a pipe SIGPIPEs the producer
          # under this shell's pipefail. jar (from the JDK) exists everywhere.
          NEW_JAR=$(ls target/eagleboardscheduler-*.jar | grep -v original- | head -1)
          jar tf "$NEW_JAR" > jar-contents.txt
          grep -q "shkc/core/EagleBoardScheduler.class" jar-contents.txt
          jar xf "$NEW_JAR" META-INF/MANIFEST.MF
          grep -q "Main-Class: shkc.core.EagleBoardScheduler" META-INF/MANIFEST.MF
      - name: Runtime smoke test (start server, exercise endpoints)
        shell: bash
        run: |
          # Full behavioral parity needs the real data files (never in the
          # repo); this smoke test uses header-only data to prove the server
          # starts, serves the UI, and answers data endpoints on this OS/arch.
          NEW_JAR=$(ls target/eagleboardscheduler-*.jar | grep -v original- | head -1)
          echo 'Type,ID,Last,First,Email,Phone,UnitType,Unit,UnitName,ProjectReview,FinalBoard,RegTime,Room,Flags,Sel,BoardHistory' > SmokeAdults.csv
          java -jar "$NEW_JAR" -verbose -a SmokeAdults.csv -c config.csv -port 18099 -d smokerun > server.log 2>&1 &
          SRV=$!
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:18099/index.html && break
            sleep 1
            if [ "$i" = 30 ]; then echo "server never became ready"; cat server.log; exit 1; fi
          done
          set -e
          curl -sf http://127.0.0.1:18099/index.html -o index.out
          grep -q "Welcome to the Eagle Board." index.out
          curl -sf http://127.0.0.1:18099/admin.html -o admin.out
          grep -qi "Eagle Board Admin Page" admin.out
          curl -sf -o /dev/null http://127.0.0.1:18099/scout-cells
          curl -sf -o /dev/null http://127.0.0.1:18099/room-cells
          curl -sf -X POST --data "Last=Smoke&First=Test&Email=s@example.org&UnitType=Troop&Unit=1" http://127.0.0.1:18099/register-scout -o /dev/null
          test -f smokerun/scouts.csv && grep -q "Smoke" smokerun/scouts.csv
          kill $SRV
          echo "runtime smoke passed on ${{ matrix.os }}"
