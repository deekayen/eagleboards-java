name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build shaded jar
        run: ./mvnw --batch-mode package
      - name: Structural parity against original jar
        run: |
          # Full runtime parity needs the real data files (not in the repo),
          # so CI runs the structural half only: it still catches any drift
          # in classes or bundled resources versus the inherited binary.
          NEW_JAR=$(ls target/eagleboardscheduler-*.jar | grep -v original- | head -1)
          unzip -l "$NEW_JAR" | grep -q "shkc/core/EagleBoardScheduler.class"
          unzip -p "$NEW_JAR" META-INF/MANIFEST.MF | grep -q "Main-Class: shkc.core.EagleBoardScheduler"
