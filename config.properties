# Eagle Board Scheduler configuration
# Edit the values after each '='. Lines starting with # are comments.
# This is the file passed to the app with -c (see scripts/run.sh).

Type=CONFIG
ID=DEFAULT
Name=DEFAULT

# How often (in seconds) the scheduler page reloads its data.
RefreshTimeSecs=30

# How long the board may spend convening before the scout is brought in --
# the members read the application, references and project workbook first.
# A single cap, not a target: there is no yellow stage, because a board still
# previewing past this point is keeping the candidate waiting outside.
ConveneRedMins=30

# Room-card warning thresholds, in minutes since the scout was brought in
# ("Start Review"). The card turns yellow at the "Yellow" time and red at the
# "Red" time. Set per board type.
ProjectYellowMins=25
ProjectRedMins=40
FinalYellowMins=30
FinalRedMins=45

# Row colors by board status now come from the browser's theme (light/dark),
# not from settings. RegisteredColor..PostponedHiColor are still accepted if
# an older config.properties sets them, but a new one should not.
