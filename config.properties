# Eagle Board Scheduler configuration
# Edit the values after each '='. Lines starting with # are comments.
# This is the file passed to the app with -c (see scripts/run.sh).

Type=CONFIG
ID=DEFAULT
Name=DEFAULT

# How often (in seconds) the scheduler page reloads its data.
RefreshTimeSecs=30

# Room-card warning thresholds, in minutes since a board was seated.
# A board's room card turns yellow at the "Yellow" time and red at the
# "Red" time. Set per board type.
ProjectYellowMins=25
ProjectRedMins=40
FinalYellowMins=40
FinalRedMins=55

# Scout row / room colors by board status (hex). "Hi" colors are used for
# the currently-selected row.
RegisteredColor=#ffcccc
VerifiedColor=#ffffcc
SeatedColor=#ccffff
InProgressColor=#ccffcc
CompletedColor=#ffffff
PostponedColor=#909090
RegisteredHiColor=#ff6666
VerifiedHiColor=#ffff66
SeatedHiColor=#66ffff
InProgressHiColor=#66ff66
CompletedHiColor=#eeeeee
PostponedHiColor=#9f7f7f
